execution_evidence:
  planned_commands:
  - make governance-validate
  - make architecture-test
  - make lint
  - make typecheck
  - make test
  - make contract-test
  - make release-check
  executed_commands:
  - uv run --locked python scripts/validate_governance_yaml.py
  - uv run --locked pytest -q tests/test_federation_contract.py tests/test_federation_service.py
  - uv run --locked --extra dev python -m pytest -q tests
  - uv run --locked --extra dev ruff check src tests scripts/run_project_gate.py
  - uv run --locked --extra dev mypy
  - bcf reconcile --repo-root . --apply
  notes:
  - "Canonical prospective contract positives passed (132 cases), but the publisher-binding negative control survived because the store independently rejected the forged publisher. Added a direct hostile-decoder rejection assertion so the control proves the wire boundary itself; production checks remain intact."
  - "Signing bootstrap follow-up: one protected installation-private key stays outside source; only its public fingerprint and origin/prefix/app/bot/channel readiness are reported. Signed frames bind the operator-approved public-key generation and reject retired or falsely declared generations. No runtime configuration or live claim is promoted."
  - "Custodian slice: service context/layer, command-side provider bridge and query-only custody inspection. Targets FederationStore, new signed wire/bridge/Slack adapter modules, opt-in runtime wiring, private enqueue API, deterministic tests, authored contracts/docs and BCF projections. Forbidden: current deployment state/credentials/listener, generated governance hand edits, public remote ingress, sessions/wake/execution authority, directory completion claims."
  - "Isolated evidence: full Python 3.12 suite passed (269 cases), including 24 bridge/adapter cases; 32 Python 3.14 federation cases passed. Ruff, mypy (38 modules), governance validation, secret/dependency/SBOM/vulnerability producers passed. A failing ambiguous-prefix route test drove exact namespace parsing; legacy-obligation conflicts roll back message backfill. Final exact-tree governed submission remains required."
  - "Provider boundary: independent installation app transport probes observed; signed adapter not deployed and private-channel, signed-origin, late-join, retention, and directory convergence qualification remain blocked."
  - "BCF 2.3.2 canonical reconciliation regenerated the push closure-mode projection; generated workflow and semantic/test manifests were not hand-edited. Signature and publisher-binding controls are registered with contract-test."
  - Provider submission is opt-in through the signed adapter; the deterministic store itself performs no provider calls.
  - Directory metadata is allowlisted and cannot carry credentials, privileges, execution, wake, or session authority.
  - BCF 2.3.3 supersedes the construction baseline only through canonical custody machinery.
known_constraints:
  - provider fan-out and origin authentication are not qualified for a multi-installation claim
  - P11 activation and successor lifecycle remain BCF-owned; no phase ledger activation is hand-edited
  - notification-only behavior remains the safe fallback for unsupported or uncertain provider and owner states
next_work:
