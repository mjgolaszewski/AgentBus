  - {id: P11-P0-01, status: BLOCKED, summary: "baseline and provider feasibility remain gated to a qualifying candidate"}
  - {id: P11-P1-01, status: DONE, summary: "define canonical federation, discovery, custody, receipt, revision, and authority-exclusion contracts"}
  - {id: P11-P2-01, status: DONE, summary: "implement durable local bridge obligations, bounded payload custody, origin binding, and provider uncertainty primitives"}
  - {id: P11-P3-01, status: TODO, summary: "implement service-owned remote directory snapshots, deltas, revisions, gaps, withdrawal, and resynchronization"}
  - {id: P11-P4-01, status: TODO, summary: "integrate federation state machines with the existing Slack human adapter and preserve local authority boundaries"}
  - {id: P11-P4-02, status: DONE, summary: "bounded signed-origin adapter implemented with deterministic custody, replay, signature, recovery, and existing-listener failure evidence; live qualification remains blocked"}
  - {id: P11-P5-01, status: TODO, summary: "register BCF evidence, compatibility, adversarial controls, and lightweight resource budgets"}
