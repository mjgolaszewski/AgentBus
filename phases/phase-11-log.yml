  highlights:
  - P09 is closed on protected main; P11 remains pending canonical lifecycle activation.
  - BCF 2.3.2 is the construction baseline while 2.3.3 custody is pending.
  - Deterministic federation contracts and local custody primitives are implemented in the existing SQLite owner.
  - Provider fan-out, origin qualification, and cross-installation claims remain explicitly blocked pending a dedicated candidate.
