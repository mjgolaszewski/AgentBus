document:
  kind: architecture_boundary_rules
  name: "AgentBus Architecture Boundary Rules"
  id: "agentbus-architecture-boundaries"
  version: 1.0.0
  generated_at_utc: "2026-09-27T00:00:00Z"
  status: active
  path: architecture-boundaries.yml
architecture:
  source_roots: [src]
  mandatory_rule_gate_policy:
    every_mandatory_rule_has_executable_gate: true
    human_review_only_allowed_with_rationale: true
    human_review_only_rules:
      - rule_id: architecture-module-size
        rationale: lite profile defers this structural gate until standard promotion
        reviewer_role: technical_lead
        phase_log_evidence: phases/phase-01-log.yml
      - rule_id: architecture-layer-membership
        rationale: lite profile defers this structural gate until standard promotion
        reviewer_role: technical_lead
        phase_log_evidence: phases/phase-01-log.yml
      - rule_id: architecture-context-membership
        rationale: lite profile defers this structural gate until standard promotion
        reviewer_role: technical_lead
        phase_log_evidence: phases/phase-01-log.yml
      - rule_id: architecture-import-boundaries
        rationale: lite profile defers this structural gate until standard promotion
        reviewer_role: technical_lead
        phase_log_evidence: phases/phase-01-log.yml
      - rule_id: architecture-cqrs-side
        rationale: lite profile defers this structural gate until standard promotion
        reviewer_role: technical_lead
        phase_log_evidence: phases/phase-01-log.yml
      - rule_id: architecture-router-thinness
        rationale: lite profile defers this structural gate until standard promotion
        reviewer_role: technical_lead
        phase_log_evidence: phases/phase-01-log.yml
      - rule_id: architecture-duplication
        rationale: lite profile defers this structural gate until standard promotion
        reviewer_role: technical_lead
        phase_log_evidence: phases/phase-01-log.yml
  production_module_policy:
    max_loc: 800
    excluded_path_tokens: [generated, migrations, migration, vendor, fixtures, snapshots, testdata, tests]
    excluded_file_suffixes: [_pb2.py, _pb2_grpc.py]
  bounded_contexts:
    required: true
    context_root_tokens: [client, service]
    shared_context_tokens: [protocol]
  layer_membership_policy:
    exactly_one_layer: true
  context_membership_policy:
    exactly_one_context: true
  cqrs_policy:
    command_path_tokens: [send, onboard, persona, ack, rebind, claim, reply, start, stop]
    query_path_tokens: [status, read, agents, inbox, health, info]
    read_model_tokens: [message, inbox, info, profile, claim]
    write_method_names: [ack, claim, commit, ingest, insert, post, publish, save, send, update]
  thin_router_policy:
    max_branch_nodes: 4
    max_loop_nodes: 0
    delegate_call_name_tokens: [api, store, poster, receiver, service]
  duplication_policy:
    enabled: true
    min_duplicate_lines: 12
    scoped_to_bounded_context: true
    allowed_cross_context_duplication: true
  shared_abstraction_policy:
    shared_path_tokens: [common, helpers, shared, utils]
    min_real_call_sites: 2
    required_metadata: [owning_layer, owning_context_or_shared_kernel, rationale, tests]
  layers:
    client:
      path_tokens: [client]
      required: true
      forbidden_import_prefixes: [fastapi, slack_sdk, uvicorn]
      forbidden_layer_imports: [service]
      forbidden_import_names: []
    service:
      path_tokens: [service]
      required: true
      forbidden_import_prefixes: []
      forbidden_layer_imports: [client]
      forbidden_import_names: []
