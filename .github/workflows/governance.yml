        "$BCF_PYTHON" scripts/governance_truth.py --repo-root . --evidence-dir .artifacts/bcf/fan-in --evaluation-mode "$BCF_COMMAND_ARG_7" --evaluation-target "$BCF_COMMAND_ARG_9" --format json --durable-ref "$BCF_COMMAND_ARG_13" --output .artifacts/bcf/truth-report.json
      if: ${{ needs.preflight.result == 'success' && needs.evidence.result == 'success' && inputs.use_prior_evidence != true }}
    - name: Verify exact-tree governance evidence with prior transport
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_9: '${{ inputs.evaluation_mode || (github.event_name == ''push'' && ''workitem'' || ''pr'') }}', BCF_COMMAND_ARG_11: '${{ inputs.evaluation_target || (github.event_name == ''push'' && ''P07-P0-03'' || '''') }}', BCF_COMMAND_ARG_15: 'github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/bcf-governance-truth'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/governance_truth.py --repo-root . --evidence-dir .artifacts/bcf/fan-in --prior-evidence-dir .artifacts/bcf/prior-evidence --evaluation-mode "$BCF_COMMAND_ARG_9" --evaluation-target "$BCF_COMMAND_ARG_11" --format json --durable-ref "$BCF_COMMAND_ARG_15" --output .artifacts/bcf/truth-report.json
      if: ${{ needs.preflight.result == 'success' && needs.evidence.result == 'success' && inputs.use_prior_evidence == true }}
    - name: Upload this attempt's terminal truth report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-governance-truth-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/truth-report.json, if-no-files-found: error, retention-days: 30}
