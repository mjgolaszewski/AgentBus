      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_5: '${{ matrix.shard }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/capture_governance_shard.py --repo-root . --shard-index "$BCF_COMMAND_ARG_5" --shard-count 4 --session-root .artifacts/bcf/sessions
    - name: Upload this attempt's exact evidence shard
