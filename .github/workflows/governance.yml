        "$BCF_PYTHON" scripts/preflight_governance.py --repo-root . --evaluation-mode "$BCF_COMMAND_ARG_5" --evaluation-target "$BCF_COMMAND_ARG_7" --python "$BCF_PYTHON" --artifact-root .artifacts/bcf --expected-producer evidence --format text
      if: ${{ inputs.use_prior_evidence != true }}
    - name: Run canonical cheap preflight with exact prior evidence
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_5: '${{ inputs.evaluation_mode || (github.event_name == ''push'' && ''workitem'' || ''pr'') }}', BCF_COMMAND_ARG_7: '${{ inputs.evaluation_target || (github.event_name == ''push'' && ''P07-P0-03'' || '''') }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/preflight_governance.py --repo-root . --evaluation-mode "$BCF_COMMAND_ARG_5" --evaluation-target "$BCF_COMMAND_ARG_7" --python "$BCF_PYTHON" --artifact-root .artifacts/bcf --expected-producer evidence --prior-evidence-dir .artifacts/bcf/prior-evidence --format text
