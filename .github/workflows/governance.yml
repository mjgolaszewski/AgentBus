      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" -m pip install -r requirements-governance.txt
    - name: Download only this attempt's evidence shards
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {pattern: 'bcf-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*', path: .artifacts/bcf/fan-in}
      if: ${{ needs.preflight.result == 'success' && needs.evidence.result == 'success' }}
    - name: Restore private evidence-session modes
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/restore_evidence_modes.py --root .artifacts/bcf/fan-in
      if: ${{ needs.preflight.result == 'success' && needs.evidence.result == 'success' }}
    - name: Verify exact-tree governance evidence
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_COMMAND_ARG_7: '${{ inputs.evaluation_mode || (github.event_name == ''push'' && ''workitem'' || ''pr'') }}', BCF_COMMAND_ARG_9: '${{ inputs.evaluation_target || (github.event_name == ''push'' && ''P07-P0-03'' || '''') }}', BCF_COMMAND_ARG_13: 'github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/bcf-governance-truth'}
      run: |-
