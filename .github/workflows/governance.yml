      evaluation_mode: {description: Exact truth evaluation mode, required: false, default: pr, type: string}
      evaluation_target: {description: Exact bounded target, required: false, default: '', type: string}
      use_prior_evidence: {description: Consume exact caller-bound prior evidence, required: false, default: false, type: boolean}
  push:
    branches: [main]
permissions: {contents: read}
env: {BCF_ENFORCE_PR_CHANGELOG: '${{ github.event_name == ''pull_request'' }}', BCF_PROVIDER_EVENT: '${{ github.event_name }}', BCF_INVOCATION_KIND: '${{ inputs.comparison_base_sha != '''' && ''reusable_call'' || ''direct_event'' }}', BCF_CALLER_COMPARISON_BASE_SHA: '${{ inputs.comparison_base_sha || '''' }}', BCF_ORIGIN_COMPARISON_BASE_SHA: '${{ github.event_name == ''pull_request'' && github.event.pull_request.base.sha || github.event_name == ''push'' && github.event.before || '''' }}', BCF_COMPARISON_BASE_SHA: '${{ inputs.comparison_base_sha || github.event_name == ''pull_request'' && github.event.pull_request.base.sha || github.event_name == ''push'' && github.event.before || '''' }}', BCF_PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'}
concurrency: {group: 'agentbus-pr-${{ github.event.pull_request.number || github.ref }}', cancel-in-progress: true}
jobs:
  preflight:
    name: Cheap Preflight
    permissions: {contents: read}
    runs-on: ubuntu-24.04
