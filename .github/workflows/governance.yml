name: Governance pull-request evidence
'on':
  pull_request: {}
  workflow_call: {}
  push:
    branches: [main]
permissions: {contents: read}
env: {BCF_ENFORCE_PR_CHANGELOG: '${{ github.event_name == ''pull_request'' }}', BCF_PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'}
concurrency: {group: 'agentbus-pr-${{ github.event.pull_request.number || github.ref }}', cancel-in-progress: true}
jobs:
  cheap-preflight:
    name: Cheap Preflight
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      run: |-
        set -euo pipefail
        "$pythonLocation/bin/python" -m pip install -r requirements-governance.txt
    - name: Cheap Preflight
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_PREFLIGHT_MODE: '${{ github.event_name == ''pull_request'' && ''pr'' || ''release'' }}', BCF_ENFORCE_PR_CHANGELOG: '${{ github.event_name == ''pull_request'' }}', BCF_PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/preflight_governance.py --repo-root . --mode "$BCF_PREFLIGHT_MODE" --python "$BCF_PYTHON" --artifact-root .artifacts/bcf --expected-producer structural-evidence --format text
    - name: Upload exact evidence-session evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-evidence-session-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions, if-no-files-found: error, retention-days: 30}
  structural-evidence:
    name: Structural Evidence
    needs: [cheap-preflight]
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      run: |-
        set -euo pipefail
        "$pythonLocation/bin/python" -m pip install -r requirements-governance.txt
    - name: Download exact evidence-session evidence
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-evidence-session-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions}
    - name: Restore private evidence-session modes
      shell: bash
      run: |-
        set -euo pipefail
        find .artifacts/bcf -type f -name evidence-session.json -execdir chmod 700 . \; -exec chmod 400 {} +
    - name: Capture each governed gate once
      shell: bash
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_GATES: governance-exposure-scan governance-validate}
      run: |-
        set -euo pipefail
        session="$("$BCF_PYTHON" scripts/governance_evidence.py --repo-root . select-session --session-root .artifacts/bcf/sessions)"
        session_dir="${session%/evidence-session.json}"
        for gate in $BCF_GATES; do
          "$BCF_PYTHON" scripts/governance_evidence.py --repo-root . run --gate "$gate" --output "$session_dir/$gate" --python "$BCF_PYTHON" --session-manifest "$session"
        done
    - name: Upload exact structural-receipts evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-structural-receipts-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions, if-no-files-found: error, retention-days: 30}
  governance-truthfulness:
    name: Terminal Governance Truth
    needs: [structural-evidence]
    if: ${{ always() }}
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out the exact candidate commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Provision the declared Python runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with: {python-version: '3.12'}
    - name: Install the declared governance environment
      shell: bash
      run: |-
        set -euo pipefail
        "$pythonLocation/bin/python" -m pip install -r requirements-governance.txt
    - name: Download exact structural-receipts evidence
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: 'bcf-structural-receipts-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/sessions}
    - name: Restore private evidence-session modes
      shell: bash
      run: |-
        set -euo pipefail
        find .artifacts/bcf -type f -name evidence-session.json -execdir chmod 700 . \; -exec chmod 400 {} +
    - name: Terminal Governance Truth
      shell: bash
      working-directory: .
      env: {BCF_PYTHON: '${{ env.pythonLocation }}/bin/python', BCF_TRUTH_MODE: '${{ github.event_name == ''pull_request'' && ''pr'' || ''closure'' }}'}
      run: |-
        set -euo pipefail
        "$BCF_PYTHON" scripts/governance_truth.py --repo-root . --evidence-dir .artifacts/bcf --evaluation-mode "$BCF_TRUTH_MODE" --format json --durable-ref "github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/bcf-governance-truth" --output .artifacts/bcf/truth-report.json
    - name: Upload exact truth-report evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: 'bcf-truth-report-${{ github.run_id }}-${{ github.run_attempt }}', path: .artifacts/bcf/truth-report.json, if-no-files-found: error, retention-days: 30}
