  architecture_layer_membership: {target: *id019, status: *id066, command_policy: architecture_layer_membership, rationale: production modules map to one layer}
  architecture_context_membership: {target: *id020, status: *id066, command_policy: architecture_context_membership, rationale: production modules map to one bounded context}
  architecture_import_boundaries: {target: *id021, status: *id066, command_policy: architecture_import_boundaries, rationale: layer import purity prevents drift}
  architecture_cqrs_side: {target: *id022, status: *id066, command_policy: architecture_cqrs_side, rationale: command and query sides stay separate}
  architecture_router_thinness: {target: *id023, status: *id066, command_policy: architecture_router_thinness, rationale: routers remain transport adapters}
  architecture_duplication: {target: *id024, status: *id066, command_policy: architecture_duplication, rationale: duplication and shared helpers stay explicit}
  lint: {target: lint, status: *id066, command_policy: lint, rationale: lint rules are wired before release-check is trusted}
  typecheck: {target: *id015, status: *id066, command_policy: *id015, rationale: static analysis is wired before release-check is trusted}
  test: {target: test, status: *id066, command_policy: automated_tests, rationale: touched behavior has automated tests}
  contract_test: {target: *id025, status: *id066, command_policy: contract_tests, rationale: public contracts and adapters have explicit checks}
  python314_compatibility: {target: python314-compatibility, status: *id066, command_policy: automated_tests, rationale: the supported client and service behavior runs under Python 3.14}
  security_secret_scan: {target: *id026, status: *id066, command_policy: security_secret_scan, rationale: pushed code is scanned for secrets}
  security_dependency_audit: {target: *id029, status: *id066, command_policy: security_dependency_audit, rationale: dependencies have a vulnerability audit lane}
  security_sbom: {target: *id030, status: *id066, command_policy: security_sbom, rationale: production-bound artifacts produce an SBOM}
  security_vulnerability_scan: {target: *id032, status: *id066, command_policy: security_vulnerability_scan, rationale: source or image vulnerability scan is wired}
  runtime_smoke: {target: *id033, status: *id066, command_policy: &id067 runtime_smoke, rationale: runtime behavior is proven in a declared environment}
  release_smoke: {target: *id035, status: *id066, command_policy: *id067, rationale: the exact Git subject produces one deterministic self-consistent source archive}
  semantic_ownership: {target: *id010, status: *id066, command_policy: semantic_ownership, rationale: declared canonical representations have one mechanically enforced owner}
  ci_certification: {target: ci-certification, status: deferred, command_policy: ci_certification, rationale: authenticated exact-commit CI state is independently recomputed before release}
