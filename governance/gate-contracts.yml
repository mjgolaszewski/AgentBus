        min_collected: 1
        min_executed: 1
        max_skipped: 0
        selectors: ['tests/test_architecture.py::test_context_import_boundaries']
        expected_node_manifest: governance/test-manifests/architecture-import-boundaries.txt
        expected_nodes_mode: exact
        artifact_binding: *id042
    negative_controls:
    - {id: client-framework-import-is-rejected, mutation: {path: *id039, yaml_path: architecture.layers.client.forbidden_import_prefixes, value: [pathlib]}, oracle: {kind: *id044, node_ids: ['tests.test_architecture::test_context_import_boundaries']}}
  architecture-layer-membership:
    invocation: {argv: [python3, *id037, *id019, --junit, &id047 .artifacts/junit/architecture-layer-membership.xml], cwd: ., env: {}, required_env: []}
    evidence:
      kind: *id040
