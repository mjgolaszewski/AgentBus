document: {kind: gate_contract_registry, version: '2.0', path: governance/gate-contracts.yml}
schema_version: '2.0'
profile_contract_version: '3.0'
target_profile: standard
execution_policy: {default_timeout_seconds: 1800}
interpreter_contract:
  project_dependencies: true
  requirements_projection: requirements-governance.txt
  optional_dependency_groups: [dev]
  gate_requirements: {}
claim_model:
  version: '1.0'
  dependency_sets:
    governance: [AGENTS.yml, &id057 MEMORY.yml, &id039 architecture-boundaries.yml, governance/**, plans/**, phases/**, schemas/**, Makefile, Makefile.fragment, .gitignore]
    client-source: [src/agentbus_*_client.py, agentbus, &id043 src/agentbus_client.py, src/agentbus_transport_client.py, src/agentbus_poll_client.py, src/agentbus_presentation_client.py, src/agentbus_parser_client.py, src/agentbus_operator_client.py, src/agentbus_rename_client.py, src/agentbus_codex_rpc_client.py, src/agentbus_codex_wake_client.py, src/agentbus_wake_inbox_client.py]
    service-source: [src/agentbus_*_service.py, contracts/channels/**, src/agentbus_federation*_service.py, contracts/federation/**, agentbus_service.py, &id056 src/agentbus_service.py, src/agentbus_status_api_service.py, src/agentbus_participation_service.py, src/agentbus_participation_store_service.py, src/agentbus_control_store_service.py, src/agentbus_claim_recovery_service.py, src/agentbus_participation_api_service.py, src/agentbus_message_assurance_service.py, src/agentbus_message_authorization_service.py, src/agentbus_presentation_service.py, src/agentbus_reply_policy_service.py, src/agentbus_request_limits_service.py, src/agentbus_send_policy_service.py, src/agentbus_send_rate_service.py, src/agentbus_settings_service.py, src/agentbus_metrics_service.py, src/agentbus_slack_command_service.py, src/agentbus_slack_socket_service.py, &id001 slack-app-manifest.json]
    participation-contract: [contracts/participation/**, schemas/participation-contract.schema.json]
    codex-wake-contract: [contracts/codex-wake/**, schemas/codex-wake-contract.schema.json]
    package-source: [src/__init__.py, &id002 pyproject.toml, uv.lock]
    client-tests: [tests/test_channel*.py, tests/test_owner_wake_qualification.py, &id065 tests/test_launcher.py, tests/test_poll_client.py, tests/test_presentation_client.py, tests/test_operator_client.py, tests/test_rename_client.py, tests/test_codex_wake_contract.py, tests/test_codex_wake_client.py, tests/test_codex_rpc_client.py, tests/test_self_service_client.py]
    service-tests: [tests/test_channel*.py, tests/test_federation_inbox_projection.py, tests/test_federation_directory_wire.py, tests/test_federation_directory_recovery.py, tests/test_federation_bridge.py, tests/test_federation_adapter.py, tests/test_federation_service.py, &id055 tests/test_service.py, tests/test_slack_commands.py, tests/test_participation_contract.py, tests/test_federation_contract.py, tests/test_participation_service.py, tests/test_participation_store.py, tests/test_control_store.py, tests/test_rename_store.py, tests/test_claim_recovery.py, tests/test_credential_rotation.py]
    architecture-tests: [&id051 tests/test_architecture.py]
    compatibility-tests: [tests/test_federation_bridge.py, tests/test_federation_adapter.py, tests/test_python_compatibility.py, *id065, tests/test_poll_client.py, tests/test_presentation_client.py, tests/test_operator_client.py, tests/test_rename_client.py, tests/test_codex_wake_contract.py, tests/test_codex_wake_client.py, tests/test_codex_rpc_client.py, *id055, tests/test_slack_commands.py, tests/test_claim_recovery.py]
    producer-code: [scripts/check_source.py, &id037 scripts/run_project_gate.py]
    release-code: [&id003 Dockerfile, .dockerignore, compose.yaml, .env.example, &id060 scripts/build_release.py, *id001]
    toolchain: [*id002, uv.lock, requirements-governance.txt]
    workflow: [.github/workflows/**, governance/ci-graph.yml]
    security-config: [&id004 SECURITY.md, *id002, uv.lock, *id003]
    documentation: [&id061 README.md, docs/**, CHANGELOG.md, CONTRACT.md, CONTRIBUTING.md, LICENSE, *id004]
    no-files: [.bcf-no-files]
    whole-tree: ['**']
  execution_groups:
    governance-contracts:
      producer: &id005 governance-validate
      claims: [governance-contracts-valid]
      captured_by_preflight: true
    governance-exposure:
      producer: &id007 governance-exposure-scan
      claims: [governance-exposure-clean]
      captured_by_preflight: true
    semantic-ownership:
      producer: &id010 semantic-ownership
      claims: [semantic-ownership-valid]
      captured_by_preflight: true
    source-quality:
      producer: lint
      claims: [source-quality-valid]
    static-types:
      producer: &id015 typecheck
      claims: [static-types-valid]
    architecture:
      producer: &id016 architecture-test
      claims: [architecture-valid]
    module-size:
      producer: &id017 architecture-module-size
      claims: [module-size-valid]
    layer-membership:
      producer: &id019 architecture-layer-membership
      claims: [layer-membership-valid]
    context-membership:
      producer: &id020 architecture-context-membership
      claims: [context-membership-valid]
    import-boundaries:
      producer: &id021 architecture-import-boundaries
      claims: [import-boundaries-valid]
    operation-populations:
      producer: &id022 architecture-cqrs-side
      claims: [operation-populations-valid]
    router-boundaries:
      producer: &id023 architecture-router-thinness
      claims: [router-boundaries-valid]
    duplication-boundaries:
      producer: &id024 architecture-duplication
      claims: [duplication-boundaries-valid]
    client-behavior:
      producer: test
      claims: [client-behavior-valid]
    service-contract:
      producer: &id025 contract-test
      claims: [service-contract-valid]
    python314-compatibility:
      producer: python314-compatibility
      claims: [python314-compatibility-valid]
    secrets:
      producer: &id026 security-secret-scan
      claims: [secrets-clean]
    dependencies-consistent:
      producer: &id029 security-dependency-audit
      claims: [&id028 dependencies-consistent]
    sbom:
      producer: &id030 security-sbom
      claims: [sbom-valid]
    vulnerabilities:
      producer: &id032 security-vulnerability-scan
      claims: [vulnerabilities-clear]
    runtime-container:
      producer: &id033 runtime-smoke
      claims: [runtime-container-valid]
    release-archive:
      producer: &id035 release-smoke
      claims: [release-archive-reproducible]
  claims:
    governance-contracts-valid:
      truth: governance contracts are internally consistent
      execution_group: governance-contracts
      legacy_gate: *id005
      dependencies:
        subject: [&id006 governance]
        detector: [*id006]
        test_population: []
        toolchain: [&id011 toolchain]
        trust: [&id036 workflow]
      qualification_scope: &id008 detector
      profiles: [normal, &id009 regulated, self]
    governance-exposure-clean:
      truth: published bytes contain no private infrastructure
      execution_group: governance-exposure
      legacy_gate: *id007
      dependencies:
        subject: [*id006, &id027 documentation]
        detector: [&id014 producer-code]
        test_population: []
        toolchain: []
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    semantic-ownership-valid:
      truth: semantic families operations and representations have one owner
      execution_group: *id010
      legacy_gate: *id010
      dependencies:
        subject: [&id012 client-source, &id013 service-source, *id006]
        detector: [*id006]
        test_population: []
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    source-quality-valid:
      truth: tracked source is structurally valid and satisfies deterministic lint rules
      execution_group: source-quality
      legacy_gate: lint
      dependencies:
        subject: [whole-tree]
        detector: [*id014]
        test_population: []
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    static-types-valid:
      truth: project source satisfies declared static type contracts
      execution_group: static-types
      legacy_gate: *id015
      dependencies:
        subject: [*id012, *id013]
        detector: [*id014]
        test_population: []
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    architecture-valid:
      truth: the architecture registry covers every production module
      execution_group: architecture
      legacy_gate: *id016
      dependencies:
        subject: [*id012, *id013]
        detector: [*id006]
        test_population: [&id018 architecture-tests]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    module-size-valid:
      truth: production modules respect the governed LOC cap
      execution_group: module-size
      legacy_gate: *id017
      dependencies:
        subject: [*id012, *id013]
        detector: [*id006]
        test_population: [*id018]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    layer-membership-valid:
      truth: each production module has one owning layer
      execution_group: layer-membership
      legacy_gate: *id019
      dependencies:
        subject: [*id012, *id013]
        detector: [*id006]
        test_population: [*id018]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    context-membership-valid:
      truth: each production module has one bounded context
      execution_group: context-membership
      legacy_gate: *id020
      dependencies:
        subject: [*id012, *id013]
        detector: [*id006]
        test_population: [*id018]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    import-boundaries-valid:
      truth: client and service dependency directions remain closed
      execution_group: import-boundaries
      legacy_gate: *id021
      dependencies:
        subject: [*id012, *id013]
        detector: [*id006]
        test_population: [*id018]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    operation-populations-valid:
      truth: CLI and API operation populations stay closed and classified
      execution_group: operation-populations
      legacy_gate: *id022
      dependencies:
        subject: [*id012, *id013]
        detector: [*id006]
        test_population: [*id018]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    router-boundaries-valid:
      truth: HTTP handlers remain bounded transport adapters
      execution_group: router-boundaries
      legacy_gate: *id023
      dependencies:
        subject: [*id013]
        detector: [*id006]
        test_population: [*id018]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    duplication-boundaries-valid:
      truth: cross-context duplication remains below the declared block size
      execution_group: duplication-boundaries
      legacy_gate: *id024
      dependencies:
        subject: [*id012, *id013]
        detector: [*id006]
        test_population: [*id018]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    client-behavior-valid:
      truth: client lifecycle profile routing cursor safety and optional Codex wake behavior pass
      execution_group: client-behavior
      legacy_gate: test
      dependencies:
        subject: [*id012, codex-wake-contract]
        detector: [*id014]
        test_population: [client-tests]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    service-contract-valid:
      truth: HTTP Slack routing persistence protocol behavior and participation contract pass
      execution_group: service-contract
      legacy_gate: *id025
      dependencies:
        subject: [*id013, participation-contract]
        detector: [*id014]
        test_population: [service-tests]
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    python314-compatibility-valid:
      truth: the declared AgentBus client and service behavior passes under Python 3.14
      execution_group: python314-compatibility
      legacy_gate: python314-compatibility
      dependencies:
        subject: [*id012, *id013, package-source]
        detector: [*id014]
        test_population: [compatibility-tests]
        toolchain: [*id011]
        trust: [*id036]
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    secrets-clean:
      truth: tracked publishable project bytes contain no credential-shaped values
      execution_group: secrets
      legacy_gate: *id026
      dependencies:
        subject: [*id012, *id013, *id027, &id034 release-code]
        detector: [*id014]
        test_population: []
        toolchain: []
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    dependencies-consistent:
      truth: installed dependencies match project declarations and lock
      execution_group: *id028
      legacy_gate: *id029
      dependencies:
        subject: [&id031 package-source]
        detector: [*id014]
        test_population: []
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    sbom-valid:
      truth: a valid reproducible CycloneDX inventory is produced
      execution_group: sbom
      legacy_gate: *id030
      dependencies:
        subject: [*id031]
        detector: [*id014]
        test_population: []
        toolchain: [*id011]
        trust: []
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    vulnerabilities-clear:
      truth: declared dependency environment has no known vulnerability
      execution_group: vulnerabilities
      legacy_gate: *id032
      dependencies:
        subject: [*id031]
        detector: [*id014]
        test_population: []
        toolchain: [*id011]
        trust: [security-config]
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    runtime-container-valid:
      truth: the pinned container builds and runs unprivileged
      execution_group: runtime-container
      legacy_gate: *id033
      dependencies:
        subject: [*id013, *id034]
        detector: [*id014]
        test_population: []
        toolchain: [*id011]
        trust: [*id034]
      qualification_scope: *id008
      profiles: [normal, *id009, self]
    release-archive-reproducible:
      truth: the exact Git subject produces one deterministic self-consistent AgentBus source archive
      execution_group: release-archive
      legacy_gate: *id035
      dependencies:
        subject: [whole-tree]
        detector: [*id034]
        test_population: []
        toolchain: [*id011]
        trust: [*id036]
      qualification_scope: *id008
      profiles: [normal, *id009, self]
gates:
  architecture-context-membership:
    invocation: {argv: [python3, *id037, *id020, --junit, &id038 .artifacts/junit/architecture-context-membership.xml], cwd: ., env: {}, required_env: []}
    evidence:
      kind: &id040 test_suite
      test_contract:
        junit_xml: *id038
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        selectors: ['tests/test_architecture.py::test_production_modules_map_to_exactly_one_bounded_context']
        expected_node_manifest: governance/test-manifests/architecture-context-membership.txt
        expected_nodes_mode: exact
        artifact_binding: &id042 non_authoritative_until_captured
    negative_controls:
    - {id: contexts-are-closed, mutation: {path: *id039, yaml_path: architecture.bounded_contexts.context_root_tokens, value: [wrong]}, oracle: {kind: &id044 test_node_failure, node_ids: ['tests.test_architecture::test_production_modules_map_to_exactly_one_bounded_context']}}
  architecture-cqrs-side:
    invocation: {argv: [python3, *id037, *id022, --junit, &id041 .artifacts/junit/architecture-cqrs-side.xml], cwd: ., env: {}, required_env: []}
    evidence:
      kind: *id040
      test_contract:
        junit_xml: *id041
        min_collected: 1
        min_executed: 1
        max_skipped: 0
        selectors: ['tests/test_architecture.py::test_command_and_query_populations_are_closed']
        expected_node_manifest: governance/test-manifests/architecture-cqrs-side.txt
        expected_nodes_mode: exact
        artifact_binding: *id042
    negative_controls:
    - {id: cli-population-drift-is-rejected, mutation: {path: *id043, search: 'CLI_OPERATIONS = {', replace: 'CLI_OPERATIONS_BROKEN = {'}, oracle: {kind: *id044, node_ids: ['tests.test_architecture::test_command_and_query_populations_are_closed']}}
  architecture-duplication:
