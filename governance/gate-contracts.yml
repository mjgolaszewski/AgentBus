  architecture-module-size:
    invocation: {argv: [python3, *id037, *id017, --junit, &id048 .artifacts/junit/architecture-module-size.xml], cwd: ., env: {}, required_env: []}
    evidence:
      kind: *id040
      test_contract:
        junit_xml: *id048
        min_collected: 1
