        min_executed: 1
        max_skipped: 0
        selectors: ['tests/test_architecture.py::test_cross_context_duplication_stays_below_declared_block_size']
        expected_node_manifest: governance/test-manifests/architecture-duplication.txt
        expected_nodes_mode: exact
        artifact_binding: *id042
    negative_controls:
    - {id: cross-context-copy-is-detected, mutation: {path: *id039, yaml_path: architecture.duplication_policy.min_duplicate_lines, value: 2}, oracle: {kind: *id044, node_ids: ['tests.test_architecture::test_cross_context_duplication_stays_below_declared_block_size']}}
  architecture-import-boundaries:
