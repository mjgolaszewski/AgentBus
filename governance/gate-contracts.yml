        expected_nodes_mode: exact
        artifact_binding: *id042
    negative_controls:
    - {id: unregistered-production-module-is-rejected, mutation: {path: tests/test_architecture.py, search: '"src/agentbus_service.py": ("service", "service"),', replace: ''}, oracle: {kind: *id044, node_ids: ['tests.test_architecture::test_architecture_registry_covers_every_production_module']}}
  contract-test:
    invocation: {argv: [python3, *id037, *id025, --junit, &id054 .artifacts/junit/contract-test.xml], cwd: ., env: {}, required_env: []}
    evidence:
      kind: *id040
      test_contract:
        junit_xml: *id054
