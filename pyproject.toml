[project]
name = "superworkspace-agentbus"
version = "0.3.0"
description = "Slack-backed coordination transport and durable inbox for coding-agent chats"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "slack-sdk==3.44.1",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "build==1.6.0",
    "cyclonedx-bom==7.4.0",
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "packaging==26.3",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "agentbus_service.py"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
