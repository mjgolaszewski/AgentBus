    - preserve_replacement_reference_when_available
environment_facts:
  current_repo_state:
    - Published baseline is stable 0.9.2; the private Slack button and complete poll-results follow-up requires its own final proof and custody
    - Certified BCF 2.3.4 Standard contract v3 remains the project runtime; successor adoption is a separate decision, not a retrospective prerequisite
    - Application source lives under src; public client/service shims and protocol2 paths remain stable; Python3.12 and pinned Python3.14 compatibility are required
    - One service, SQLite database, Slack app and socket serve an explicit bounded channel registry; each grant-backed identity has one immutable channel
    - Exact session and inbox proof precedes reads writes aliases replies claims and controls; sender labels grant no authority
    - Local request UUID epoch staging and profile CAS preserve uncertain outcomes, STOP and independent cursor maxima; rename retains conflicting credential or recovery evidence
    - Component proofs cover delivery enrollment lifecycle introduction STOP ingress shared snapshots rename and configured commands; applicability is limited to each retained input manifest
    - Released fresh-store policy defaults, quiet skill guidance, fresh-control polling and lifecycle flag refresh retain exact-subject evidence; new follow-ups need independent applicability
    - Routine Slack enrollment and poll navigation use private buttons with exact operator and channel checks; separate plain approval commands preserve mobile copy-and-paste fallback without granting authority
    - History payload and public cursor reads share a writer-stable snapshot; experimental terminal observations bind thread and turn; caught provider failures retain degraded worker status
    - Authored request lookup is an additive exact-session and inbox query; retained sender ownership and exact frame hash gate transport facts; missing evidence stays unknown and supplies no resend authority
    - Queue acceptance provider posting destination custody host completion and semantic ACK are separate; presentation cleanup never substitutes for them
    - Operational worker views report local observations; observability templates are not a qualified collector or immutable audit service
  active_artifacts:
    spec: plans/product-spec.yml
    build_plan: plans/build-plan.yml
    active_phase_ledger: plans/phase-ledger.yml
    phase_history: plans/phase-history.yml
    active_phase_plan: plans/phase-12-plan.yml
    active_workitem_ledger: plans/phase-12-workitems.yml
    active_phase_log: phases/phase-12-log.yml
known_constraints:
  - Owner-wake qualification remains active under Issue75; AHP/native-queue live interoperability and atomic idle-only admission are unqualified, with unknown owners notification-only
  - Owner admission must bind backend transport incarnation connection generation and exact thread; upstream reports and idle observations do not grant writer or retry authority
  - Historical federation canaries apply only to their pinned subjects; no new multi-installation or live-provider qualification follows from local regression success
  - AgentBus assumes a trusted workspace with trusted non-hostile agents and operators; hostile OS/process isolation credential theft and independent agent authority inference remain outside its guarantee
  - Existing unresolved or legacy-unknown custody remains pinned; offline migration, backup and repair-forward rules govern incompatible cutovers; public Slack channels provide no confidentiality or indefinite availability guarantee
  - Reported full-service hangs remain unclassified; the snapshot and carrier-classification repairs do not establish their cause or a remote-health guarantee
  - Every final subject requires canonical protected PR exact-main archive and isolated-installation proof; deployment and live canaries remain separate custodian actions with concrete prerequisites
  - Source work stays in active P12; no inherited hotfix retirement or computed phase closure is inferred from authored DONE entries or component evidence
  - Complete editorial review retains exact line coverage hashes and dispositions, excludes BCF machinery and changelog, and preserves historical proof; current capability text links Experimenters guidance
  - Historical inputs may be cold-archived only with verified content manifests restoration instructions and durable references; live environments Git objects credentials databases and service volumes remain protected
