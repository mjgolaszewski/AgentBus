document:
  kind: durable_project_memory
  name: "AgentBus Working Memory"
  id: "agentbus-memory"
  version: 1.0.0
  generated_at_utc: "2026-09-27T00:00:00Z"
  status: active
  path: MEMORY.yml
regression_shield:
  purpose: keep this file as durable project memory, not as an execution transcript
  invariants:
    - store stable decisions, constraints, environment facts, reusable commands, and references
    - keep workitem execution evidence in phases/*.yml
    - update high-signal entries instead of duplicating them
    - never record secrets or local environment values here
stable_decisions:
  canonical_repo_root: "."
  canonical_governance_guide: AGENTS.yml
  canonical_product_spec: plans/product-spec.yml
  canonical_build_plan: plans/build-plan.yml
  canonical_active_phase_ledger: plans/phase-ledger.yml
  canonical_phase_history: plans/phase-history.yml
  canonical_phase_log_root: phases/
  code_roots:
    backend: src
    frontend: not_applicable
  delivery_architecture:
    backend: "flat client and service contexts with closed operation mappings"
    frontend: "not_applicable"
    data: "SQLite inbox and local JSON consumer profiles"
    observability: open_telemetry_traces_plus_structured_trace_linked_logs
  governance_process:
    semantic_validator: scripts/validate_governance_yaml.py
    structural_schema_root: schemas/
    hotfix_lane: governed_and_machine_readable
    artifact_ownership: canonical_owner_map_recorded_in_AGENTS
    phase_rollover: phase_ledger_and_MEMORY_must_move_together
    build_artifact_convention: follow_local_template_pack_shapes_and_naming
memory_retention_policy:
  stable_decisions:
    review_frequency: per_phase_rollover
  environment_facts:
    revalidate_after_days: 30
  reusable_commands:
    validate_on_release_gate: true
  stale_entry_handling:
    - mark_deprecated_before_removal
    - preserve_replacement_reference_when_available
environment_facts:
  current_repo_state:
    - all governance, memory, specs, plans, workitem ledgers, and phase logs are YAML-native
    - observability contracts are scaffolded under contracts/observability/v1/
    - structural anti-drift gates are scaffolded for module size, layer ownership, bounded-context ownership, CQRS side rules, router thinness, and duplication
    - application behavior is characterized on Python 3.12 with a pinned Python 3.14 compatibility subprocess in the primary BCF evidence lane
    - BCF 2.1.6 Standard profile contract v3 governs the repository through the canonical prospective train
    - AgentBus v0.3.0 is published from commit 9ceb0cd4916291b5fb3f65b81eda4c84bce1ad53 and the superworkspace consumes its attested immutable archive
    - direct protected-main authority is retained without trusted-controller or BCF release authority
    - production implementations live under src while top-level client and service shims preserve public executable and import paths
    - routed Slack envelopes are admitted only from the bot identity authenticated from the configured bot token
    - new consumer profiles use the XDG state directory while WEED_WORKSPACE remains a compatibility fallback
    - identity-aware inbox reads filter and page in indexed SQLite queries with legacy audience migration
    - Phase 04 delivers operator participation and optional host-owned Codex wake without granting core turn authority; Phase 05 adds service-derived assurance separating legacy from wake-eligible traffic
  active_artifacts:
    spec: plans/product-spec.yml
    build_plan: plans/build-plan.yml
    active_phase_ledger: plans/phase-ledger.yml
    phase_history: plans/phase-history.yml
    active_phase_plan: plans/phase-05-plan.yml
    active_workitem_ledger: plans/phase-05-workitems.yml
    active_phase_log: phases/phase-05-log.yml
known_constraints:
  - preserve the public CLI HTTP protocol SQLite state and deployment behavior during governance adoption
  - use only immutable released BCF artifacts and digests; preserve provider boundaries without persistent trusted-controller capability
  - specialize repo_identity_provider and repo_observability_backend in the observability contracts before production use
  - per-agent credentials signed federation clustering and multi-tenant authorization remain outside the same-workspace product scope
  - Slack retention and the local SQLite copy must both be approved for transported data
  - Issue 6 operator control and participation behavior must derive from the versioned participation contract; no operator authority from sender labels or ordinary bearer tokens
  - legacy protocol-2 clients receive one upgrade notice per inbox identity, with repeatable instructions on explicit info reads; ordinary message pages stay unchanged
  - Issue 8 Codex wake is optional host-owned adapter behavior from contracts/codex-wake/v1/codex-wake.contract.yml; AgentBus core never owns threads, credentials, or turn lifecycle
  - live-wakable idle chats spend zero turns on routine in-chat polling; the local worker continues and unchanged observations start no model turn
reusable_commands:
  - make governance-validate
  - make architecture-test
  - make lint
  - make typecheck
  - make test
  - make release-check
references:
  governance:
    - AGENTS.yml
    - governance-profile.yml
    - architecture-boundaries.yml
    - schemas/
    - contracts/observability/v1/
    - contracts/codex-wake/v1/
    - plans/phase-ledger.yml
    - plans/phase-history.yml
    - docs/OPERATIONS.md
  product:
    - plans/product-spec.yml
    - plans/build-plan.yml
  execution:
    - plans/phase-03-plan.yml
    - plans/phase-03-workitems.yml
    - phases/phase-03-log.yml
