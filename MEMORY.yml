    - all governance, memory, specs, plans, workitem ledgers, and phase logs are YAML-native
    - observability contracts are scaffolded under contracts/observability/v1/
    - structural anti-drift gates are scaffolded for module size, layer ownership, bounded-context ownership, CQRS side rules, router thinness, and duplication
    - application behavior was extracted from superworkspace-tools history and characterized by 63 tests on Python 3.12 and 3.14
    - BCF 2.1.0 Lite is a bootstrap while released 2.1.1 adopter fixes and Standard profile contract v3 are required for certification
    - production implementations live under src while top-level client and service shims preserve public executable and import paths
  active_artifacts:
