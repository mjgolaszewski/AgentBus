    frontend: "not_applicable"
    data: "SQLite inbox and local JSON consumer profiles; snapshot-based session-authority CAS preserves independent metadata and cursor maxima, rejects conflicting recovery intents; retained rotation receipt precedes revoked-secret preflight; service binding precedes credential egress and STOP stays intact; registered client save_profile effect port remains a local delegating callable"
