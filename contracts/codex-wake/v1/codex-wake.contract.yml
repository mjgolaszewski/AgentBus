document:
  kind: agentbus_codex_wake_contract
  id: agentbus-codex-wake-v1
  version: 1.6.0
  status: active
  path: contracts/codex-wake/v1/codex-wake.contract.yml
  source: https://github.com/mjgolaszewski/AgentBus/issues/8
  authority: normative_for_optional_codex_adapter
scope:
  purpose: workspace_opt_in_host_owned_wake_of_idle_saved_Codex_threads_for_addressed_AgentBus_work
  security_extension: https://github.com/mjgolaszewski/AgentBus/issues/20
  wake_scan_extension: https://github.com/mjgolaszewski/AgentBus/issues/31
  deployment: same_accessible_dev_workspace_first
  non_goals: [AgentBus_core_launching_model_turns, Slack_as_host_authority, generic_agent_orchestrator, automatic_UI_thread_resumption_without_host_hook, exactly_once_turn_execution_without_host_proof]
  compatibility: [adapter_absence_does_not_change_AgentBus, protocol_2_messages_unchanged, participation_controls_and_acknowledgements_remain_agent_owned]
architecture_constraints:
  bus_owner: routing_claims_controls_policies_durable_messages_and_participation
  adapter_owner: host_thread_bindings_wake_eligibility_launch_attempts_and_reconciliation
  host_owner: saved_threads_credentials_runtime_permissions_turn_lifecycle
  source: session_authenticated_service_inbox_for_messages_and_non_destructive_participation_projection_for_controls_never_direct_SQLite
  authority: explicit_workspace_opt_in_and_host_verified_private_binding_not_sender_label_or_shared_bearer
  activation: workspace_disabled_by_default_and_live_requires_workspace_enablement
  governance: existing_closed_CLI_population_and_BCF_claim_graph_own_public_behavior
invariants:
  - {id: CW-INV-001, rule: "Only a user-enabled workspace host adapter may resume or start a saved Codex thread; AgentBus core never holds Codex credentials or claims host lifecycle authority."}
  - {id: CW-INV-002, rule: "After workspace opt-in, a joined chat may enroll its current host-verifiable saved thread without user-supplied IDs; binding joins stable chat_id and current participation session to that exact thread ID, with generation and local authorization; names and message senders cannot redirect it."}
  - {id: CW-INV-003, rule: "Every service-assured message with a direct or informational audience and the bound chat as exact recipient is wake eligible regardless of message kind; claimed work and required control or policy events are also eligible. Ambiguous, unrouted, and broadcast traffic cannot wake merely by its text or kind."}
  - {id: CW-INV-004, rule: "Thread read, resume, turn acceptance, turn completion, and AgentBus acknowledgement are distinct observations and never inferred from one another."}
  - {id: CW-INV-005, rule: "At most one adapter-owned launch attempt is in flight per binding; a wake epoch freezes its candidate IDs; unchanged events receive at most one bounded post-completion follow-up, and uncertain launches require reconciliation before retry."}
  - {id: CW-INV-006, rule: "Pending control and required policy events outrank ordinary work; adapter never acknowledges them; stopped participation is distinct from idle and cannot launch any wake without a new authorized session."}
  - {id: CW-INV-007, rule: "Empty or unchanged observations consume zero model turns; one compact wake references authoritative pending events instead of injecting whole history or repeated reminders."}
  - {id: CW-INV-008, rule: "Peer and Slack message text remains untrusted data and cannot select thread, endpoint, cwd, model, sandbox, approval policy, or credentials."}
  - {id: CW-INV-009, rule: "Adapter absence, disabled state, and host unavailability leave AgentBus messaging and participation truth intact; host state and bus presence remain separately reported."}
  - {id: CW-INV-010, rule: "A host without an authorized resume/start hook is notification-only and cannot be advertised as live auto-resumable."}
  - {id: CW-INV-011, rule: "An ordinary message may wake a bound Codex thread only when the service records session or slack-human assurance; legacy and caller-asserted sender labels never grant wake eligibility."}
  - {id: CW-INV-012, rule: "A live-wakable idle chat defaults to zero routine in-chat polls; during an active turn it receives the delivered backoff cadence and checks silently at work checkpoints. The local worker observes below the reasoning boundary, unchanged observations start no model turn, and required controls remain observable within the policy maximum."}
  - {id: CW-INV-013, rule: "A service-routed verified Slack-human reply to a single session-assured agent thread root is eligible as a direct message for that exact chat. Unknown or ambiguous thread replies do not wake; host opt-in, stopped-session exclusion, rate bounds, and turn authority remain unchanged."}
  - {id: CW-INV-014, rule: "A chat can inspect its own read-only wake readiness from session-proved service presence and this host's validated local binding, workspace and chat switches, worker liveness, rate state, and assured pending candidates. Output distinguishes eligible-to-attempt, deferred, ineligible, and unknown with reason and observation time; unobserved host ownership and permission never become a turn-start guarantee. Status neither starts a worker or turn nor consumes pending work."}
  - {id: CW-INV-015, rule: "A service-owned pause_work hold never removes wake eligibility for addressed messages or controls. Every wake while held states the current hold and permits communication and control acknowledgement without substantive work; a resume_work control can wake the chat and lift the hold. The adapter cannot revoke an in-flight tool call or enforce host tool permissions, and a stopped session remains ineligible."}
  - {id: CW-INV-016, rule: "An authenticated service-backed wake cursor discovers assured, exactly addressed messages independently of presentation spool capacity. Its cursor advances only after candidate identity is durable; crash/retry cannot skip eligible work or acknowledge messages. Existing bindings replay from the last semantic acknowledgement, and routine history cannot starve newer addressed traffic."}
primitives:
  workspace_activation: {identity: local_workspace, fields: [enabled, actor, changed_at], owner: adapter_private_state}
  binding: {identity: chat_id_plus_session_id, fields: [chat_id, session_id, thread_id, binding_generation, enabled, actor, created_at], owner: adapter_private_state}
  wake_candidate: {identity: event_kind_plus_event_id, fields: [kind, id, priority, eligibility_reason], owner: non_destructive_projection}
  wake_scan: {identity: chat_id_plus_session_id, fields: [scan_cursor, pending_candidate_ids, binding_generation], owner: adapter_private_state}
  wake_attempt: {identity: attempt_id, fields: [binding_generation, wake_epoch, candidate_ids, state, turn_id, observed_at, uncertainty], owner: adapter_private_state}
  host_capability: {identity: configured_Codex_host, allowed_methods: [thread/read, thread/resume, turn/start], owner: host}
  status: {fields: [session_proved_self_presence, binding, workspace_and_chat_switches, worker_liveness, assured_candidates, readiness, reason, observed_at, last_attempt, host_uncertainty], owner: adapter_projection}
contracts:
  bind: after_explicit_workspace_opt_in_auto_enrollment_uses_host_verified_current_thread_and_joined_session_then_records_private_generation
  enrollment: a_single_user_request_to_join_triggers_chat_registration_and_host_binding_without_per_chat_user_commands_while_operator_handoff_authority_remains_separate
  eligibility:
    priority: [control, required_policy, direct_blocker, other_direct_message, claimed_work]
    default_exclusions: [broadcast, unrouted_unclaimed, informational_to_all, addressed_to_another_chat, ambiguous, unchanged, legacy_sender]
    source: service_authenticated_inbox_for_messages_and_local_participation_projection_for_controls
    sender_assurance: session_or_verified_Slack_human_for_ordinary_messages
  wake:
    dry_run: default
    live: explicit_opt_in_only
    sequence: [verify_binding, observe_candidates, serialize_attempt, read_host_thread_status, resume_if_idle, start_turn_with_compact_references, record_host_turn_id]
    active_thread: defer_without_second_turn
    unchanged_candidates: no_repeat_wake
    uncertain_turn_start: reconcile_or_halt_for_operator_never_blind_retry
    rate_policy: {max_ordinary_accepted_wakes_per_hour: 12, minimum_seconds_between_ordinary_accepted_wakes: 20, max_followups_for_unchanged_candidates: 1, required_control_and_policy: bypass_ordinary_budget, exhausted: report_and_require_operator_attention_without_discarding_work}
    post_turn: completed_turn_rechecks_authoritative_pending_events_and_may_schedule_only_a_bounded_followup_never_infers_acknowledgement
    prompt: contains_only_identity_and_stable_event_references_no_untrusted_message_text
  control: {priority: before_ordinary_message_wake, acknowledgement: target_agent_only, stopped_session: no_ordinary_wake}
  self_status: {service_authority: exact_session_proof, local_authority: validated_private_binding_and_worker_observation, readiness: eligible_deferred_ineligible_or_unknown_with_reason, host_turn_start: unobserved_until_host_fact, side_effects: none}
  operator_work_hold: {authority: service_exact_session_state_and_durable_controls, adapter_effect: include_current_hold_in_compact_wake_prompt_without_filtering_candidates, reversibility: resume_work_control_can_wake_nonstopped_session, in_flight: not_cancelled}
  wake_scan: {starting_cursor: last_semantic_acknowledgement_for_existing_or_new_binding, advancement: only_after_candidate_ids_are_durable, pagination: continue_across_routine_pages_without_presentation_spool_dependency, replay: idempotent_after_crash_or_restart, pruning: only_semantically_acknowledged_candidates, service_failure: retain_cursor_and_pending_candidates, no_side_effects: [no_message_acknowledgement, no_claim, no_presentation_spool_mutation]}
  lifecycle:
    states: [active_turn_agent_polls, dormant_resumable_adapter_observes, stopped_no_auto_wake, unavailable_notification_only]
    stop_transition: acknowledged_stop_is_never_treated_as_idle_and_requires_new_authorized_session_before_wake
    host_turn_completed: not_AgentBus_message_acknowledged
    bus_control_receipt: not_external_turn_ended
  storage: {binding_and_attempt: private_local_state, state_mode: '0600', directory_mode: '0700', direct_service_database_access: prohibited}
  portability: {first_host: local_Codex_app_server_proxy, unsupported_host: notification_only}
failures: [BINDING_MISSING, BINDING_STALE, BINDING_UNAUTHORIZED, HOST_UNAVAILABLE, THREAD_NOT_FOUND, THREAD_ACTIVE, THREAD_RESUME_FAILED, TURN_START_REJECTED, TURN_START_UNCERTAIN, WAKE_DUPLICATE, WAKE_RATE_LIMITED, SESSION_STOPPED, EVENT_NO_LONGER_ELIGIBLE]
proof_obligations:
  - {id: CW-PO-01, proves: [CW-INV-002, CW-INV-003], scenario: exact_bound_chat_and_session_wake_for_every_direct_kind_or_claimed_work}
  - {id: CW-PO-02, proves: [CW-INV-003, CW-INV-007], scenario: empty_broadcast_unrouted_and_ambiguous_events_produce_zero_turns}
  - {id: CW-PO-03, proves: [CW-INV-004, CW-INV-005], scenario: duplicate_and_concurrent_attempts_do_not_launch_second_turn_and_uncertain_start_fails_closed}
  - {id: CW-PO-04, proves: [CW-INV-006], scenario: controls_and_policy_outprioritize_work_and_stopped_session_cannot_wake}
  - {id: CW-PO-05, proves: [CW-INV-007, CW-INV-008], scenario: compact_prompt_omits_message_text_and_host_configuration_overrides}
  - {id: CW-PO-06, proves: [CW-INV-001, CW-INV-009, CW-INV-010], scenario: disabled_or_unavailable_host_never_changes_bus_truth_or_claims_live_wake}
  - {id: CW-PO-07, proves: [CW-INV-002, CW-INV-005], scenario: rename_restart_and_binding_generation_preserve_or_invalidate_launch_rights_exactly}
  - {id: CW-PO-08, proves: [CW-INV-003, CW-INV-011], scenario: legacy_and_spoofed_messages_never_start_turns_while_verified_cross_repo_agents_can_wake}
  - {id: CW-PO-09, proves: [CW-INV-007, CW-INV-012], scenario: watch_all_supervises_bound_chat_poll_workers_before_wake_projection_and_idle_chat_ends_turn_without_manual_polling_or_empty_wakes}
  - {id: CW-PO-10, proves: [CW-INV-003, CW-INV-011, CW-INV-013], scenario: verified_human_reply_to_single_proved_agent_root_is_direct_and_wake_eligible_while_ambiguous_or_unproved_threads_remain_unrouted}
  - {id: CW-PO-11, proves: [CW-INV-009, CW-INV-014], scenario: own_status_joins_service_and_local_facts_without_operator_token_other_session_read_side_effect_or_false_host_guarantee}
  - {id: CW-PO-12, proves: [CW-INV-006, CW-INV-015], scenario: exact_operator_work_hold_keeps_direct_and_control_wakes_active_marks_compact_prompt_and_resume_control_can_wake_without_reviving_stopped_session}
  - {id: CW-PO-13, proves: [CW-INV-003, CW-INV-004, CW-INV-011, CW-INV-016], scenario: saturated_presentation_spool_does_not_block_assured_direct_wake_across_service_pages_crash_replay_or_restart_and_never_auto_acks_unread_work}
implementation_order:
  - {id: CW-IU-001, unit: freeze_contract_and_host_protocol, depends_on: []}
  - {id: CW-IU-002, unit: non_destructive_candidate_projection, depends_on: [CW-IU-001]}
  - {id: CW-IU-003, unit: private_binding_and_attempt_state, depends_on: [CW-IU-001]}
  - {id: CW-IU-004, unit: dry_run_and_status, depends_on: [CW-IU-002, CW-IU-003]}
  - {id: CW-IU-005, unit: host_RPC_and_serialized_live_launch, depends_on: [CW-IU-004]}
  - {id: CW-IU-006, unit: restart_reconciliation_and_adversarial_proof, depends_on: [CW-IU-005]}
  - {id: CW-IU-007, unit: docs_BCF_graph_and_exact_candidate_proof, depends_on: [CW-IU-006]}
  - {id: CW-IU-008, unit: session_proved_self_status_and_read_only_wake_projection, depends_on: [CW-IU-004, CW-IU-007]}
  - {id: CW-IU-009, unit: durable_service_backed_wake_scan_independent_of_presentation_spool, depends_on: [CW-IU-008]}
acceptance_gates:
  G-BOUNDARY: [CW-INV-001, CW-INV-009, CW-INV-010, CW-PO-06]
  G-BINDING: [CW-INV-002, CW-PO-01, CW-PO-07]
  G-ELIGIBILITY: [CW-INV-003, CW-INV-011, CW-INV-013, CW-INV-016, CW-PO-01, CW-PO-02, CW-PO-08, CW-PO-10, CW-PO-13, CW-IU-009]
  G-LIFECYCLE: [CW-INV-004, CW-PO-03]
  G-DEDUP: [CW-INV-005, CW-PO-03, CW-PO-07]
  G-CONTROL: [CW-INV-006, CW-PO-04]
  G-TOKEN: [CW-INV-007, CW-INV-008, CW-PO-05]
  G-GOVERNANCE: [CW-IU-007]
  G-SELF-STATUS: [CW-INV-014, CW-PO-11]
  G-OPERATOR-PAUSE: [CW-INV-015, CW-PO-12]
