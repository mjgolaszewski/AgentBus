  G-BOUNDARY: [CW-INV-001, CW-INV-009, CW-INV-010, CW-INV-020, CW-INV-022, CW-PO-06, CW-PO-17, CW-PO-19]
  G-BINDING: [CW-INV-002, CW-PO-01, CW-PO-07]
  G-ELIGIBILITY: [CW-INV-003, CW-INV-011, CW-INV-013, CW-INV-016, CW-INV-018, CW-PO-01, CW-PO-02, CW-PO-08, CW-PO-10, CW-PO-13, CW-PO-15, CW-IU-009]
  G-LIFECYCLE: [CW-INV-004, CW-INV-017, CW-INV-019, CW-INV-021, CW-PO-03, CW-PO-14, CW-PO-16, CW-PO-18]
  G-DEDUP: [CW-INV-005, CW-PO-03, CW-PO-07]
  G-CONTROL: [CW-INV-006, CW-PO-04]
  G-TOKEN: [CW-INV-007, CW-INV-008, CW-PO-05]
  G-GOVERNANCE: [CW-IU-007]
  G-SELF-STATUS: [CW-INV-014, CW-PO-11]
  G-OPERATOR-PAUSE: [CW-INV-015, CW-PO-12]
