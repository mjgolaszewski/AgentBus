document:
  kind: agentbus_federation_contract
  id: agentbus-federation-v1
  version: 1.0.0
  status: active
  path: contracts/federation/v1/federation.contract.yml
  source: https://github.com/mjgolaszewski/AgentBus/issues/48
  authority: normative_for_p11_federated_runtime_and_p09_local_custody_baseline

scope:
  purpose: outbound_only_inter_instance_transport_and_remote_directory_projection
  deployment: independent_agentbus_installations_using_an_existing_provider
  channel_authority: contracts/channels/v1/channel-isolation.contract.yml
  candidate_qualification: changed_runtime_requires_fresh_applicability_and_two_channel_canary
  owner_wake_experimental: live_AHP_native_queue_and_atomic_idle_only_admission_unqualified
  provider: slack_first_outbound_bridge
  compatibility: [protocol_2_messages, local_cursors, slack_threads, sessions, claims, operator_controls]
  non_goals: [public_agentbus_endpoint, bespoke_relay, distributed_registry, credential_replication, remote_execution_authority, exactly_once_business_effects]

invariants:
  - {id: FB-INV-001, rule: "A successful local send means the origin instance durably accepted the message and its outbound bridge obligation in one local transaction; provider availability is not required."}
  - {id: FB-INV-002, rule: "Origin identity is immutable across transport: origin_instance_id and origin_message_id remain bound to the authenticated publisher and recipient instance/route; the destination may allocate a different local cursor."}
  - {id: FB-INV-003, rule: "Bridge states remain distinct: origin_accepted, bridge_submitted, bridge_uncertain, destination_accepted, and agent_acknowledged are never inferred from one another."}
  - {id: FB-INV-004, rule: "Destination persistence deduplicates by authenticated origin instance, origin message, and destination identity; duplicate, delayed, or replayed provider events are idempotent."}
  - {id: FB-INV-005, rule: "Remote discovery carries only allowlisted identity and freshness metadata. It never creates a local session, grants a privilege, authorizes execution, claims work, or acknowledges an agent message."}
  - {id: FB-INV-006, rule: "Directory freshness is separate from registration, running state, wakeability, and active-turn state. Unknown, stale, gap, withdrawn, or contradictory observations fail closed."}
  - {id: FB-INV-007, rule: "Outbound bridge retry is bounded and crash-recoverable. Uncertain provider results remain uncertain until reconciled; the sender never fabricates destination acceptance."}
  - {id: FB-INV-008, rule: "Local owner-mediated wake may admit only a verified idle owner after an epoch recheck. Remote transport and discovery cannot start a turn, steer an active turn, or acknowledge queued work."}
  - {id: FB-INV-009, rule: "Directory updates converge by revisioned snapshot and delta. A gap, expired provider history, or missed withdrawal requires bounded resynchronization and cannot silently delete another origin's entry."}
  - {id: FB-INV-010, rule: "All provider payloads, routes, metadata, credentials, and execution requests are untrusted at the destination and are rejected when unsigned, oversized, conflicting, or outside the configured origin binding."}
  - {id: FB-INV-011, rule: "Only an operator-configured publisher binding may speak for an origin namespace; discovery metadata is an approved projection and never a trust bootstrap."}
  - {id: FB-INV-012, rule: "A complete directory snapshot is bounded, validated before atomic commit, and revisioned monotonically per origin across routes; malformed input, duplicate routes, conflicting revisions, and stale snapshots cannot purge valid entries. Missing routes withdraw only on a complete newer snapshot. Gaps retain last valid metadata, block delta promotion, and clear only through a complete snapshot at or beyond the observed gap revision. Stale results retain the decoded directory schema. Complete owner snapshots contain only current or withdrawn entries; an explicit non-active registration cannot be current. The metadata limit retains compact JSON encoding compatibility. Directory allocation is bounded to 1024 retained routes per origin (including withdrawal tombstones) and 65 origins; capacity rejects new allocation atomically, preserves existing updates and replay, and never deletes history to make space."}

primitives:
  local_message: {identity: origin_instance_id_plus_origin_message_id, owner: local_store}
  bridge_obligation: {identity: origin_instance_id_plus_origin_message_id_plus_destination_instance, states: [origin_accepted, submitted, uncertain, provider_blocked, destination_accepted, acknowledged], owner: local_store}
  directory_revision: {identity: origin_instance_id_plus_monotonic_revision, states: [absent, snapshotting, current, stale, gap, resync_required, withdrawn], owner: local_store}
  owner_capability: {identity: session_id_plus_owner_incarnation, states: [unknown, unavailable, active, approval_wait, idle, interrupted, failed, unloaded, stale, contradictory], owner: local_owner_adapter}
  wake_intent: {identity: wake_intent_id_plus_owner_epoch, states: [pending, eligible, submitting, uncertain, queued, admitted, running, completed, blocked], owner: local_owner_adapter}
  execution_correlation: {identity: wake_intent_id_plus_turn_id, owner: conversation_host}

contracts:
  ordinary_local_custody:
    version: 1
    request_capability: X-AgentBus-Delivery-Version_1
    CLI_negotiation: info_response_header_advertises_version_joined_send_and_reply_negotiate_before_post_UUID_retry_flag_preserves_uncertain_identity
    request_identity: canonical_UUID_Idempotency-Key_bound_to_exact_authenticated_request
    response: HTTP_202_existing_Message_shape_after_atomic_local_message_and_outbox_commit
    pending_provider_reference: empty_slack_ts_never_a_fabricated_provider_timestamp
    compatibility: authenticated_immediate_requests_keep_HTTP_201_and_protocol_2_envelopes_no_unjoined_authority
    provider_locator: context_block_id_binds_existing_outbox_identity_only_content_must_match_canonical_protocol_2_payload
    authority: exact_session_authorization_before_each_accept_or_replay_no_provider_or_semantic_ack_inferred
    custody: existing_MessageStore_SQLite_transaction_and_single_service_process
    local_admission_capacity:
      outstanding: all_states_except_submitted_including_unknown_states_default_1024
      retained_requests: independent_default_65536_including_submitted_UUID_fingerprint_and_result
      provider_observations: independent_default_131072
      configuration: operator_finite_positive_limits_outstanding_lte_retained_lte_1000000_observations_gte_retained_lte_2000000
      replay: exact_authenticated_retry_and_conflict_resolution_precede_capacity_checks
      exhaustion: atomic_503_before_rate_reservation_message_append_or_provider_effect
      operator_visibility: aggregate_usage_limits_and_80_percent_warnings_private_status_and_health_only
      retention: no_automatic_deletion_expiry_or_supported_archive_lookup_lifecycle
      residual: independent_history_limit_still_eventually_backpressures_not_a_global_database_disk_quota
    remote_route: approved_distinct_prefix_requires_atomic_signed_bridge_obligation_with_local_cursor_no_legacy_fallback
    offline_startup: explicit_AGENTBUS_LOCAL_DELIVERY_VERSION_1_allows_local_API_without_Slack_no_unverified_ingress_or_federation_authority
    remote_ancestry: explicit_peer_ordinary_version_3_only_strict_canonical_wrapper_and_origin_message_destination_parent_tuple_no_foreign_local_references
    ordinary_v3_roots: required_null_parent_distinguishes_atomic_ordinary_producer_from_private_legacy_enqueue
    ordinary_v3_projection: resolve_exact_frozen_own_parent_frame_and_local_cursor_only_validate_local_recipient_owner_keep_foreign_assurance_notification_only
    ordinary_v3_gaps: known_parent_without_actual_provider_reference_retains_custody_withholds_receipt_and_checkpoint_until_read_only_recovery
    physical_threads: derive_only_from_locally_observed_parent_duplicate_posts_may_fork_physical_threads_without_changing_logical_parent
    duplicate_projection: authenticated_exact_custody_may_add_same_channel_provider_reference_to_existing_bounded_observation_store_never_another_cursor
    limits: bounded_retained_outbox_attempts_payload_and_provider_observations_no_automatic_history_pruning
    federated_reference: atomic_nullable_exact_signed_frame_hash_binds_own_provider_observation_to_existing_local_cursor_no_legacy_backfill_or_synthetic_timestamp
    own_observation: exact_configured_publisher_frame_bytes_and_positive_provider_reference_only_no_destination_custody_or_ack_inferred
    channel_isolation: provider_work_and_recovery_select_only_the_configured_channel_even_when_a_UUID_is_reused_elsewhere
    exhausted_submission: read_only_history_and_verified_echo_may_resolve_custody_after_eight_attempts_without_another_post
    local_lost_response: bounded_complete_provider_history_before_uncertain_retry_exact_authenticated_bot_locator_and_payload_only_no_global_checkpoint_change
    history_failure: keep_uncertain_custody_and_defer_retry_without_burning_submission_attempt_or_blocking_new_local_acceptance
    provider_HTTP: streaming_raw_response_limit_8388608_bytes_identity_encoding_only_absolute_15_second_deadline_no_false_success_on_overflow_or_timeout
  historical_canary_evidence:
    authority: observed_historical_subject_only_not_final_subject_or_semantic_ack
    required: [operator_pinned_origin_publisher_generation, original_single_event_carrier_bytes, verified_signature, six_directed_pairs, exact_destination_receipt_payload_hash]
    rejection: [forged_bytes_or_publisher, substituted_public_generation, missing_receipt, changed_receipt_attribution, false_subject_relabeling]
  local_acceptance: {commit_order: [message, bridge_obligation], provider_side_effect_after_commit: true, acknowledgement: semantic_agent_ack_only}
  bridge_submission: {transport: outbound_only, retry: bounded, uncertainty: explicit, dedupe_key: origin_instance_id_plus_origin_message_id_plus_destination_instance}
  history_recovery:
    operator_setting: history_limit
    default_events: 100
    maximum_events: 1000
    admission: exact_integer_1_through_1000_before_binding_or_provider_work
    provider_page_events: 100
    provider_page_ceiling: 10
    coverage: complete_history_after_existing_checkpoint_before_advancing_to_actual_observed_reference
    overflow: retain_custody_checkpoint_and_attempt_budget_no_automatic_reset_or_partial_coverage_claim
  custody_capacity:
    retained_rows_per_table: 1024
    tables: [bridge_obligations, federation_origin_messages, federated_messages]
    payload_bytes_per_row: 48000
    exhaustion: reject_new_allocation_without_deletion_or_false_acceptance
    existing_rows: preserve_exact_retry_receipts_and_state_recovery_even_if_legacy_over_capacity
    archive: operator_owned_no_automatic_pruning
    exclusions: not_a_global_sqlite_disk_quota_or_provider_retention_guarantee
  destination_acceptance: {requires: [authenticated_origin, valid_route, schema_valid_payload, deduplicated_persistence], provider_receipt_is_not_acceptance: true}
  inbox_projection:
    version: 1
    retained_mapping_rows: 1024
    activation: explicit_operator_inbox_projection_1
    identity: authenticated_origin_message_destination_to_unique_local_cursor
    provider_reference: actual_verified_event_timestamp_never_fabricated
    transaction: ordinary_message_and_projection_mapping_commit_together_before_receipt
    assurance: protocol_2_legacy_local_assurance_never_session_or_wake_authority
    foreign_ancestry: thread_and_reply_cursor_retained_in_custody_but_not_projected_as_local_references
    recovery: duplicate_and_restart_reuse_first_projection_without_changing_its_cursor
    conflicts: fail_closed_without_overwriting_existing_local_message_or_mapping
  directory: {revisioning: monotonic_per_origin, payload: allowlisted_metadata_only, freshness: explicit, stale_default: unknown, resync: bounded_snapshot_then_deltas}
  wake: {admission: owner_confirmed_idle_only, epoch_recheck: required, active_owner: defer, queued_work: never_acknowledged, remote_authority: none}
  prohibited_edges: [remote_message_to_local_execution, remote_directory_to_session_creation, provider_receipt_to_destination_acceptance, queued_wake_to_agent_ack, stale_directory_to_wakeability]
  directory_wire:
    envelope_version: 2
    payload_version: 1
    operations: [snapshot, delta, request]
    revision_range: positive_signed_64_bit_integer
    activation: explicit_per_peer_directory_version_2_and_operator_chat_allowlist
    source: committed_participation_roster_only
    disclosure: stable_chat_id_route_protocol_and_active_registration_only
    requests: bounded_coalesced_and_deduplicated_with_signed_custody_receipts
    request_recovery: durable_peer_revision_gap_nonce_reused_across_restart
    compatibility: legacy_message_and_receipt_frames_remain_version_1
    exclusions: no_ordinary_inbox_message_no_semantic_ack_no_local_session_or_wake_authority
  signed_provider_adapter:
    version: 1
    channel_audience: operator_approved_public_channel
    confidentiality: no_content_confidentiality_claim
    retention: operator_reported_retain_all_observed_recovery_window_only_until_independently_qualified
    carrier_fidelity: exact_success_response_message_text_required_without_truncation_warning
    carrier_failure: durable_provider_blocked_with_safe_reason_and_provider_reference_no_automatic_retry
    blocked_resolution: authenticated_destination_receipt_may_establish_custody_operator_recovery_otherwise_required
    signature: ed25519_over_canonical_utf8_json_without_signature_field
    publisher_binding: operator_owned_origin_instance_plus_route_prefix_plus_provider_publisher_plus_public_key
    frame_fields: [agentbus_federation, kind, origin_instance_id, origin_message_id, destination_instance_id, key_generation, payload, signature]
    key_generation: sha256_of_operator_approved_raw_ed25519_public_key
    frame_kinds: [message, receipt]
    private_keys: local_only_never_transported
    custody: message_payload_and_bridge_obligation_in_one_existing_sqlite_transaction
    retry: durable_attempt_reservation_before_provider_call_with_bounded_backoff_and_attempts
    receipt: signed_destination_origin_message_identity_and_payload_hash_after_destination_commit
    recovery: bounded_complete_provider_history_before_checkpoint_advance
    ingress: existing_socket_listener_only_no_new_remote_http_endpoint
    enqueue: optional_authenticated_local_api_separate_from_existing_protocol_2_send_response

proof_obligations:
  - {id: FB-PO-001, proves: [FB-INV-001, FB-INV-007], scenario: local_commit_survives_provider_outage_and_crash_before_submission}
  - {id: FB-PO-002, proves: [FB-INV-002, FB-INV-004, FB-INV-010], scenario: forged_duplicate_delayed_and_conflicting_provider_events_fail_closed_or_deduplicate}
  - {id: FB-PO-003, proves: [FB-INV-005, FB-INV-006, FB-INV-009], scenario: join_rename_withdrawal_late_join_gap_and_resync_converge_without_authority_promotion}
  - {id: FB-PO-004, proves: [FB-INV-003, FB-INV-007], scenario: uncertain_submission_reconciles_without_false_destination_receipt}
  - {id: FB-PO-005, proves: [FB-INV-008], scenario: active_owner_race_defers_and_idle_owner_admits_one_coalesced_wake_without_acknowledgement}
  - {id: FB-PO-006, proves: [FB-INV-010, FB-INV-011], scenario: oversized_untrusted_metadata_credentials_routes_and_execution_requests_are_rejected}
  - {id: FB-PO-007, proves: [FB-INV-012], scenario: bounded_snapshot_revision_gap_and_partial_input_preserve_directory_custody}

qualified_provider_evidence:
  consumer: scripts/verify_provider_canary.py
  scope: exact_released_subject_and_observed_window_only
  runtime_applicability: pinned54_file_archive_manifest_equals_current_bytes_after_only_reviewed_matching0_8_to0_9_version_literals_in_pyproject_service_and_root_lock_metadata
  release_metadata_exclusions: no_dependency_behavior_bootstrap_or_other_file_byte_changes_no_mixed_or_unknown_versions_no_source_identity_relabeling
  versions: {ordinary_message: 3, signed_receipt: 1, directory_control: 2}
  required: [approved_publisher_and_ed25519_generation, exact_origin_destination_and_payload_digest, six_directed_roots, six_signed_reply_parent_triplets, observed_thread_broadcast_parent_references, twelve_signed_destination_receipts, six_empty_directory_withdrawals_and_signed_receipts, offline_same_database_recovery, stopped_session_rejection, bounded_latest_primary_preserving_rollback]
  physical_retries: identical_signed_carriers_may_repeat_without_new_logical_origins
  provenance: provider_metadata_is_authenticated_api_observation_not_independent_server_attestation
  exclusions: [semantic_acknowledgement, local_session_owner_or_wake_authority, deployment_authority, computed_phase_closure, subject_relabeling, indefinite_retention_or_confidentiality_guarantee]

implementation_order:
  - {id: FB-IU-001, unit: local_acceptance_and_bridge_obligation, depends_on: []}
  - {id: FB-IU-002, unit: authenticated_provider_submission_and_destination_deduplication, depends_on: [FB-IU-001]}
  - {id: FB-IU-003, unit: bounded_directory_snapshot_and_delta_projection, depends_on: [FB-IU-002]}
  - {id: FB-IU-004, unit: owner_capability_and_idle_wake_admission, depends_on: []}
  - {id: FB-IU-005, unit: deterministic_fake_provider_and_fake_owner_evidence, depends_on: [FB-IU-002, FB-IU-003, FB-IU-004]}
  - {id: FB-IU-006, unit: authorized_provider_qualification, depends_on: [FB-IU-005]}

acceptance_gates:
  local_custody: [FB-INV-001, FB-INV-003, FB-INV-007, FB-PO-001, FB-PO-004]
  identity_and_deduplication: [FB-INV-002, FB-INV-004, FB-INV-010, FB-PO-002]
  directory: [FB-INV-005, FB-INV-006, FB-INV-009, FB-INV-012, FB-PO-003, FB-PO-007]
  owner_wake: [FB-INV-008, FB-PO-005]
