  priority: exact_stop_end_turn_before_ordinary_poll_broadcast_or_other_cached_controls
  wake: STOP_reference_is_shown_first_within_safety_bucket; complete_required_control_set_is_preserved
  effect: projection_order_only; no_control_ACK_receipt_host_or_participation_authority_change

rename_profile_handoff:
  owner: src/agentbus_rename_client.py
  serialization: directory_lock_then_sorted_source_and_target_profile_locks
  authority: recheck_fresh_source_authority_after_service_receipt_before_target_creation
  recovery: compare_source_and_target_credentials_STOP_and_retained_intents_before_source_removal
  conflict: preserve_both_profiles; no_automatic_credential_or_intent_selection
  cursors: same_scope_nonnegative_integer_maxima_only; no_new_semantic_acknowledgement
  durability: fsync_new_profile_and_parent_directory_before_source_unlink
  interface: existing_rename_command_and_service_receipt_only; no_new_identity_or_channel_authority

slack_command_configuration:
  owner: src/agentbus_settings_service.py
  setting: AGENTBUS_SLACK_COMMAND
  default: /agentbus
  population: one_exact_operator_configured_command_per_service
  syntax: slash_then_lowercase_letter_then_at_most_31_lowercase_letters_digits_underscore_or_hyphen
  authorization: same_operator_allowlist_and_invoking_channel_checks_in_both_dispatch_layers
  rejection: unsupported_name_is_private_and_has_no_command_custody_or_effects
  presentation: authored_examples_use_configured_name; human_and_agent_content_is_not_rewritten
  prerequisite: matching_command_registered_in_existing_Slack_app; no_runtime_provider_configuration_mutation

fresh_install_polling:
  owner: participation_policy_and_HTTP_service_bootstrap
  idle_minutes: [1, 2, 4, 8, 12, 16, 24, 32]
  default_values: {initial_interval_seconds: 60, backoff_factor: 2, max_interval_seconds: 1920, control_check_max_seconds: 60, jitter_fraction: 0, overdue_grace_seconds: 120, presentation_budget_bytes: null}
  initialization: once_only_on_HTTP_startup_when_policy_history_and_enrolled_identities_are_both_empty
  preservation: existing_policies_revisions_sessions_and_ACK_authority_unchanged; no_implicit_repair_of_populated_policy_less_state
  resets: new_semantic_work_returns_idle_interval_to_initial; repeated_empty_reads_do_not_reset
  control_checks: independent_of_idle_backoff; no_dropped_or_implicitly_acknowledged_controls
  token_efficiency: existing_worker_or_blocking_wait; no_model_turns_or_console_narration_for_unchanged_empty_polls
  reporting: new_work_controls_material_state_changes_and_actionable_failures_only
  enforcement_limit: CLI_worker_output_is_deterministic; agents_remain_responsible_for_their_own_narration_and_token_use

foreground_poll_recovery:
  owner: client_participation_projection
  admission: fresh_exact_session_control_check_before_cached_event_selection; failure_preserves_cache_without_presentation
  precedence: pending_STOP_and_controls_before_old_message_notices_even_when_worker_has_not_checked_in
  nonterminal: refresh_authenticated_recipient_state_and_elapsed_flags_without_retiring_or_acknowledging_work
  preserved: unknown_or_foreign_outcomes_original_payload_receipts_semantic_ACK_and_host_authority

authored_request_query:
  capability: authored-request-outcome-v1
  path: GET /v1/requests/{request_id}/outcome
  authority: exact_active_session_and_bound_inbox_before_UUID_lookup; retained_session_sender_same_chat_only
  absence: unknown_including_foreign_or_retired; never_nonacceptance_or_retry_authority
  transport: retained_exact_federation_frame_hash_and_message_UUID; destination_custody_is_not_execution_or_semantic_ACK
  compatibility: additive_query; existing_message_status_cursor_and_protocol_2_unchanged
