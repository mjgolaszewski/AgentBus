document:
  kind: participation_authorization_contract
  version: 2.0.9
  status: active
  path: contracts/participation/v2/participation.contract.yml
extends: contracts/participation/v1/participation.contract.yml
changes:
- Operator-granted immutable channel membership replaces unjoined message authority
- All agent data-plane operations require session proof and inbox binding
- Existing exact-session controls policy ACK rotation and STOP semantics persist
compatibility:
  slack_envelope: 2
  http_paths: retained; strict session proof required
  legacy_client: explicit client update and enrollment required; no bearer-only fallback
channel_authority: contracts/channels/v1/channel-isolation.contract.yml
model:
  identity:
    owner: ParticipationStore
    stable_key: chat_id
    cardinality: one_immutable_channel_per_chat
    inherited_membership:
    - session
    - current_route
    - reserved_aliases
  principal:
    owner: ChannelPrincipal
    fields:
    - chat_id
    - session_id
    - route
    - channel
    - inbox_id
    resolution: exact_secret_then_enabled_channel_then_inbox_assertion_before_resource_lookup
  enrollment_grant:
    owner: ChannelStore_and_grant_consumption_transaction
    fields:
    - channel
    - route
    - repo
    - optional_chat_id
    - expires_at
    - token_hash
    lifetime_seconds: 600
    retry: same_staged_secret_returns_original_receipt
  enrollment_approval_request:
    owner: agentbus_enrollment_approval_service
    stable_key: request_UUID_plus_exact_staged_secret_digest
    fields: [request_id, repo, route, display_name, profile_chat_UUID, secret_digest, expires_at, approved_channel, approved_actor, consumed_session]
    authority: pending_request_has_none; Slack_allowlisted_human_binds_channel; canonical_grant_owner_finalizes_once
    recovery: same_request_subject_and_secret_return_original_session; no_credential_in_Slack
  public_position:
    owner: ChannelStore
    key: channel_plus_public_position
    internal_reference: messages_cursor_private_and_unchanged
inheritance:
  precedence: v2_and_channel_contract_override_conflicting_v1_authorization_only
  optional_lifecycle_override: message_lifecycle_v1_after_explicit_offline_cutover_overrides_ordinary_work_and_shared_read_deadlines_only_not_safety_or_exact_session_authority
  retained:
  - policy_resolution
  - exact_revision_ack
  - durable_controls
  - stop_receipts
  - presence
  - cadence
  - alias_attribution
  - rotation
  - work_hold
  - presentation_cleanup
  replaced_invariants:
    INV-017: no_legacy_compatibility_authority_or_upgrade_notice_path
    INV-021: all_new_enrollment_requires_operator_grant
    INV-023: historical_legacy_rows_retained_but_no_new_unjoined_API_sends
    INV-027: exact_session_and_inbox_required_for_all_agent_reads_and_writes
    INV-030: per_session_send_limit_and_existing_allocation_bounds_preserved_without_unjoined_tier
    INV-031: allowlisted_verified_human_replies_require_one_current_local_agent_in_durable_proved_ancestry;
      human_rooted_slash_send_threads_allowed; unknown_mixed_stopped_foreign_or_unproved_threads_notification_only
    INV-032: explicit_destination_within_membership_or_existing_approved_federation_channel
    INV-036: allowlisted_human_commands_resolve_channel_first_exact_session_UUID_unique_UUID_suffix_or_unique_current_identity_fragment;
      ambiguity_denies_without_effect
  replaced_sections:
    scope_compatibility: protocol2_wire_and_paths_preserved_but_legacy_authorization_removed
    scope_migration_assumptions: explicit_offline_channel_migration_and_matching_client_required
    message_principal: immutable_channel_and_inbox_in_exact_session_principal
    join_and_resume: operator_grant_before_new_identity_and_exact_policy_ack_before_activation
    security_expansion: strict_session_channel_contract_without_bearer_only_fallback
    Slack_operator_commands: allowlisted_invoking_channel_for_targets; health_is_private_global_read_only_human_operator_view
  superseded_proof_expectations:
    PO-25: unsupported_client_fails_closed_instead_of_retaining_legacy_message_access
    PO-32: first_join_uses_grant_and_recovers_lost_response_with_same_secret
    PO-36: missing_or_foreign_proof_denies_all_message_operations
    PO-41: no_unjoined_destination_compatibility
    PO-45: suffix_full_ID_and_unique_current_identity_fragment_resolve_only_within_invoking_channel
experimental_boundary:
  multichannel: candidate_until_final_canonical_and_two_channel_live_evidence
  AHP_or_native_queue: research_only_no_production_adapter
  atomic_idle_only_wake: unqualified
slack_interaction:
  identity_resolution:
    scope: invoking_channel_before_any_target_resolution
    accepted:
    - full_session_UUID
    - unique_6_to_12_hex_session_suffix
    - unique_case_insensitive_current_identity_substring
    ambiguity: no_post_control_or_other_mutation; require_full_session_UUID
    aliases: current_identity_only; retained_aliases_do_not_select_a_different_session
  human_replies:
    authorization: same_exact_human_operator_allowlist_as_slash_send; empty_disables_routing
    ancestry: single_current_enrolled_nonstopped_local_agent; human_rooted_direct_requests_supported
    authority: direct_request_only; no_control_tool_host_or_membership_authority
    quota: same_persistent_per_human_send_bucket_as_slash_send
    transaction: provider_dedup_before_quota; quota_and_append_atomic; failed_append_rolls_back
    denied: retained_unrouted; provider_retries_never_upgrade_prior_notification
  health:
    audience: allowlisted_human_operator_only; private_ephemeral_response
    scope: global_read_only_dashboard; no_global_agent_view
    contents: version_runtime_socket_channels_custody_local_federation_and_process_local_delivery_task_cycle_progress_with_optional_distinct_lifecycle_policy_storage_and_pinned_history
    exclusions: credentials_private_paths_key_material_exception_text_remote_health_or_wake_guarantees; external_poll_and_wake_workers_not_observed
    bounds: at_most_64_channel_details_in_privileged_read_model;_Slack_renders_8_with_explicit_truncation
    worker_observations: bounded_process_local_task_and_delivery_federation_cycle_attempt_completion_backoff_failure; terminal_task_atomically_retires_active_cycles_without_completion; fixed_error_codes_only; restart_resets; completed_cycle_is_not_delivery_or_execution
    inspection_commands: workers_and_doctor_are_private_operator_wide_reads; pending_optional_ID_and_explain_positive_public_cursor_are_invoking_channel_only
    query_limits: pending_at_most_20_rows_per_recipient_control_transport_group; optional_ID_filters_identity_work_and_exact_session_controls_and_omits_transport; explain_returns_retained_metadata_without_bodies_or_pickup_tokens
    query_effects: no_provider_probe_process_scan_new_daemon_settlement_retry_ACK_cache_flush_or_automatic_repair
    unavailable_cursor: same_non_disclosing_result_for_unknown_foreign_or_retired_public_position
  presentation:
    projection_only: true
    header: outbox_sender_and_inbox_recipient_icons_with_direction_arrow; literal_identity_labels
    wire_envelope: 2
    rich_text: Slack_Block_Kit_mrkdwn_for_human_projection; escaped_control_markup; literal_machine_envelope_retained
    safety:
    - no_automatic_mentions
    - no_link_or_media_unfurls
    - bounded_block_text
    - durable_echo_locator_preserved
    health_readability: spaced_named_sections; textual_states_without_repeated_colored_dots; numeric_values_use_theme_controlled_inline_code
    plain_text_fallback: retained_for_command_responses_and_accessibility

mandatory_announcements:
  commands: /agentbus broadcast TEXT; /agentbus poll QUESTION
  authority: existing_Slack_operator_allowlist; invoking_channel_only
  representation: one_operator_control_payload; per_session_target_receipts_only; no_message_fanout
  targets: fixed_snapshot_of_non_stopped_sessions_in_invoking_channel; no_late_join_expansion
  delivery: control_check_before_ordinary_inbox; redeliver_until_explicit_acknowledgement_or_declared_optional_lifecycle_read_expiry
  presentation_reconciliation:
    authority: fresh_exact_session_inbox_authenticated_check_in_pending_announcement_ids_complete_snapshot
    scope: only_pre_request_cached_broadcast_and_poll_notices_absent_from_snapshot
    preserved: safety_controls_unknown_shapes_concurrent_new_notices_server_outcomes_ACK_receipts_and_checkpoints
    unavailable_or_legacy_server: retain_cached_evidence_without_local_clock_expiry
    effect: disposable_projection_cleanup_only_never_read_acknowledgement
  broadcast_ack: exact_session_explicit_read_receipt; delivery_or_rendering_does_not_ack
  poll_ack: exact_session_explicit_bounded_answer_required; read_without_answer_remains_pending
  recovery: stable_Slack_trigger_identity; same_request_returns_original_control; changed_request_fails_closed
  limits: text_1_to_1000_characters; answer_1_to_2000_characters
  status: private_channel_scoped_Slack_results_up_to_8_targets; existing_privileged_control_status_for_full_report
  exclusions: no_forced_model_turn; no_proof_of_comprehension; offline_sessions_remain_pending_unless_declared_optional_lifecycle_read_expiry_applies; no_remote_fanout

slack_enrollment_approval:
  status: construction_unqualified_until_exact_subject_proof_and_bounded_live_validation
  agent_command: join_without_grant_file_stages_private_secret_and_random_request_UUID
  http_path: existing_POST_sessions; approval_request_ID_and_profile_UUID_without_channel_selector
  pending: HTTP_202_no_session_or_message_authority; retry_same_private_staged_secret_and_immutable_subject
  operator_commands: enrollments_lists_unassigned_and_same_channel_pending_privately; approve_REQUEST_UUID_in_intended_configured_channel
  waiting: optional_foreground_wait_up_to_600_seconds; backoff_2_4_8_16_then_30_seconds; no_background_or_model_turn_authority
  authority: exact_existing_Slack_operator_allowlist; approval_channel_is_invocation_channel
  completion: canonical_internal_grant_and_enrollment_in_same_transaction; raw_grant_never_returned_or_persisted
  replay: exact_secret_returns_original_session; altered_subject_or_secret_or_channel_denied
  limits: request_lifetime_600_seconds; at_most_8192_retained_requests; 30_new_requests_per_minute_aggregate; expired_unconsumed_requests_pruned
  receipts: canonical_session_channel_inbox_and_policy_revision; explicit_policy_ACK_required
  expiry_recovery: HTTP_403_with_X-AgentBus-Recovery-Code_enrollment_request_expired_only_after_exact_retained_subject_and_secret_match; unknown_or_mismatched_requests_remain_generic
  expiry_retry: consumed_exact_request_recovers_original_session_before_expiry_check; no_automatic_new_request_or_secret_replacement
  client_error_safety: fixed_allowlisted_header_code_only_on_enrollment_403; never_echo_response_body_or_arbitrary_header_values
  compatibility: private_file_grants_remain_supported; old_servers_deny_unknown_approval_fields_without_fallback
  migration: additive_table_only; existing_identity_credentials_and_grants_unchanged; no_membership_transfer
  excluded: no_automatic_approval; no_grants_from_bearer_or_route_labels; no_operator_credential_in_agent_chat

quiet_alias_presentation:
  owner: src/agentbus_poll_client.py
  authority: service_classified_actionable_direct_or_informational_in_verified_session_scope
  priority: same_as_current_route_even_when_recipient_is_reserved_old_alias
  excluded: broadcast_context_only_unrouted_unclaimed_and_foreign_projection
  boundaries: presentation_cleanup_never_advances_semantic_ACK_or_changes_session_inbox_channel

foreground_observation:
  owner: src/agentbus_client.py
  producers: complete_foreground_poll_message_and_nonhistorical_inbox
  effect: scope_and_credential_rechecked_under_profile_lock_then_monotonic_observed_cursor_only
  excluded: semantic_ACK_pickup_completion_truncated_routine_presentation_and_explicit_historical_reads
  ordinary_profile_saves: preserve_ack_and_observed_high_water_only_within_same_chat_session_inbox_channel_service
  explicit_rebind: same_scope_cursor_reset_remains_deliberate_existing_command
  mismatched_or_stopped_session: retain_evidence_without_cursor_write

client_profile_recovery:
  owner: src/agentbus_profile_client.py
  state: private_in_memory_read_snapshot; no_new_profile_wire_field_or_database_schema
  persistence: under_existing_profile_lock_compare_fresh_session_authority_to_read_snapshot_before_any_write
  conflicts: reject_stale_service_channel_inbox_chat_session_secret_or_STOP; retain_recovery_evidence
  independent_updates: preserve_fresh_unchanged_metadata_and_pending_intents; reject_conflicting_changed_fields
  cursors: preserve_monotonic_high_water_except_explicit_same_scope_rebind
  credential_egress: compare_bound_service_before_info_rebind_enrollment_or_rotation_request
  rotation_retry: retained_exact_grant_and_staged_new_secret_recover_original_receipt_without_revoked_old_secret_preflight
  rotation_STOP: receipt_recovery_never_clears_STOP_or_reactivates_session
  replacement: explicit_new_operator_grant_and_current_valid_session_required; no_automatic_staged_secret_replacement

terminal_presentation_recovery:
  owner: src/agentbus_poll_client.py
  control_projection: foreground_and_worker_check_in_project_fresh_exact_session_controls_before_ordinary_cached_messages
  completion: matching_successful_handled_cursor_retires_only_its_local_MESSAGE_notice
  cached_target: authenticated_exact_recipient_outcome_handled_or_expired_unclaimed_may_retire_notice
  inbox_scan: terminal_records_advance_private_scan_without_new_presentation
  preserved: unknown_mismatched_failed_queries_recovery_required_semantic_ACK_pickup_receipts_durable_history_and_wake_intents
  wake_prompt: nonhistorical_inbox_observation_before_deliberate_semantic_ACK; explicit_after_remains_stateless

introduction_recovery:
  owner: src/agentbus_enrollment_client.py
  custody: existing_delivery_payload_owner_shared_with_ordinary_send; no_new_message_authority
  order: exact_policy_receipt_then_participation_worker_then_optional_introduction
  first_submit: immutable_payload_epoch_stage_then_profile_request_UUID_then_POST
  retry: original_profile_UUID_and_stage_only; missing_stage_fails_closed; no_automatic_replacement
  concurrent_first_submit: profile_snapshot_conflict_stops_losing_UUID_before_POST
  text: literal_profile_introduction; dash_never_reads_stdin
  acknowledgement: introduction_acceptance_never_acknowledges_its_recipients_or_advances_semantic_cursor

stop_presentation_precedence:
