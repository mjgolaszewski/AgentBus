  - {id: IU-006, unit: silent_policy_aware_poll, depends_on: [IU-003, IU-005]}
  - {id: IU-007, unit: durable_controls_and_per_target_receipts, depends_on: [IU-002, IU-004]}
  - {id: IU-008, unit: stop_ack_and_restart_recovery, depends_on: [IU-006, IU-007]}
  - {id: IU-009, unit: rename_alias_continuity, depends_on: [IU-002, IU-007]}
  - {id: IU-010, unit: compact_presentation, depends_on: [IU-006]}
  - {id: IU-011, unit: operator_status_and_explain, depends_on: [IU-005, IU-007, IU-008]}
  - {id: IU-012, unit: optional_controls_and_claim_recovery, depends_on: [IU-009, IU-011]}
  - {id: IU-013, unit: docs_migration_and_full_vertical_proof, depends_on: [IU-002, IU-003, IU-004, IU-005, IU-006, IU-007, IU-008, IU-009, IU-010, IU-011, IU-012]}

