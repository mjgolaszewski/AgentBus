request:
  scope: Current product documents, contracts, audience guides and skills; changed spans reviewed against retained full-document
    baselines. Engineering records retain historical evidence; excluded changelog entries receive hash metadata only.
  excluded:
  - BCF-owned governance machinery, generated projections, schemas and workflows
  - Changelog prose; existing inventory hash metadata is maintained without a new editorial review
  - Executable source/test data and opaque upstream input manifests; these are not product documentation
  - This inventory is excluded from self-hashing
  history_policy: Original signed evidence and old narratives remain in immutable Git history; current references bind original
    bytes by SHA-256. No history rewrite, signature substitution or relabelled qualification.
  completion_rule: Whole-file hashes bind retained full-document review and current changed-span inspection. Structured audit
    data is checked against its source population; neither editorial nor code review substitutes for final canonical release
    proof.
