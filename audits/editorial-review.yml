document:
  kind: editorial_audit
  path: audits/editorial-review.yml
  status: editorial_review_complete
request:
  scope: Current public product guidance, application contracts, packaged skill and historical authored prose; explicit
    per-document line review and disposition.
  excluded:
  - BCF-owned governance machinery, generated projections, schemas, workflows, instruction pointers and phase/evidence
    records
  - Changelog prose
  - Executable source, test fixtures, dependency locks and opaque provider evidence
  - This inventory and structured audit result data are excluded from self-hashing
  history_policy: Historical audit inventories remain reachable at the pinned baseline; current guidance is capability-oriented.
    No historical proof is relabelled as current qualification.
  completion_rule: Line review is an editorial claim only; canonical protected PR/exact-main/archive/install and
    approved acceptance remain independently required.
baseline_review:
  source: 89eb2e35f040741a5031e1255edbdb0d695c128d
  inventory: audits/editorial-review.yml
  sha256: 6e25f4b8b777b0d140300842273ec5a8c61873bc3c3520854332b6019a3c4628
experimental_claims:
  candidate: 0.11.0 was published with exact-subject custody; this documentation hotfix requires its own canonical
    proof. Prior release authority is not relabelled.
  AHP_native_queue: Live interoperability and atomic idle-only admission remain unqualified.
  publication: Explicit optional named-destination policy only; production-client canary waived by operator in favor
    of approved two-location substitution, with isolated provider controls; broader client deployments not inferred.
  A2A: Opt-in loopback-only 1.0 mailbox subset; completion means admission. Public deployment, streaming and push
    unsupported.
  retention: Off by default, dry-run-first, real target semantic ACK and custody/reference pins; no automatic federation
    retirement.
  monitoring: Bounded actual-access observations and explicitly requested private notices; no continuous-monitoring
    or execution guarantee.
