document:
  kind: editorial_audit
  path: audits/editorial-review.yml
  status: reviewed_local_validation_passed
request:
  scope: Complete product documentation review, including historical records and product contracts; line-by-line
    coverage and disposition per file
  excluded:
  - CHANGELOG.md (explicit user exclusion)
  - BCF-owned governance machinery, generated projections, runtime, schemas and workflows
  - Executable source/tests and opaque input pin manifests are implementation/evidence data, not prose documentation;
    signed YAML canary records are included and retained byte-for-byte
  - 'AGENTS.md AGENTS.yml CLAUDE.md governance-profile.yml and schemas: BCF policy/schema machinery excluded;
    application architecture-boundaries.yml and product plans/logs included'
  - Binary illustrations are retained assets; their textual presentation and alt text are reviewed in Markdown.
    This audit excludes itself from content hashing to avoid a recursive digest.
  history_policy: Preserve original private narrative snapshots and immutable signed machine evidence; anonymize
    public prose without changing or relabelling historical outcomes
  dispositions:
  - updates
  - merged
  - removed
  - new
  - retained
  completion_rule: No document marked reviewed without full line inspection; pending rows mean audit incomplete.
    Re-review modified bytes and refresh hashes before final candidate.
experimental_claims:
  multichannel: Historical bounded local two-channel RC1 evidence retained; RC2 requires fresh final-subject
    proof and renewed bounded local canary
  AHP_native_queue: offline research; no production adapter
  atomic_idle_only_wake: unqualified
  federation: historical pinned canary is not changed-runtime proof
