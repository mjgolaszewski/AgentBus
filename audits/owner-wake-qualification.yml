excluded_edges:
- federation metadata to local wake authority
- advisory idle to guaranteed admission
- queue receipt to execution
- completion to semantic acknowledgement
- Microsoft AHP source to OpenAI extension interoperability
- another app-server to existing IDE writer ownership
proposed_admission_requirements:
  status: design_requirements_not_supported_RPC_schema
  required_identity:
  - exact chat and thread
  - session
  - workspace opt-in
  - binding generation
  - owner incarnation
  - policy revision
  - stable durable attempt and event references
  decision: owner checks eligibility and reserves idle turn in the same serialized operation; reject stale or busy without leaving a deferred
    wake
  queued_alternative: separate weaker capability; may run after an intervening turn; never advertise as atomic reject-if-busy
  unknown_response: retain original attempt and batch; reconcile same owner identity; no blind resubmission or alternate transport
  resume: revalidate current permissions and network policy without copying credentials or treating resume as ownership transfer
  idempotency: pending-message upsert is not proof of durable deduplication after consumption or owner restart
  mixed_pending_list: explicit queued kind; never steering; reject ambiguous unsupported protocol shapes
  acknowledgement: queue, admission, running and terminal observations cannot acknowledge AgentBus work
evidence_matrix:
- case: idle observation races with user turn
  test: test_idle_observation_does_not_supply_atomic_admission
  claim: current standalone interface has no conditional idle admission; characterization only
- case: finalization and restored policy rejection
  test: test_owner_rejection_never_promotes_input_to_acknowledgement
  claim: owner rejection is not terminal execution or semantic ACK; injected errors, not upstream integration
- case: restart after uncertain submission
  test: test_restart_after_lost_start_response_preserves_original_attempt
  claim: replacement fake host cannot trigger blind resend; durable intent preserved
- case: actual AHP queue/steer routing, post-consumption replay, reconnect and permission negotiation
  test: null
  claim: pending real protocol conformance; no provider claim
live_prerequisites:
- identify a disposable Agent-Host-owned chat and exact provider/build
- verify supported authenticated same-user endpoint without taking over a writer
- pin negotiated protocol schema and action validation
- establish reliable consumption/reconciliation and duplicate boundaries
- operator-approved isolated bounded execution canary with rollback and current permission policy
decision:
  deterministic_research: go
  production_AHP_adapter: no_go_until_owner_and_contract_qualified
  atomic_idle_only_claim: no_go_without_owner_conditional_admission
  runtime_default: retain notification_only
upstream_addendum:
