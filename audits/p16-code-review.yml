checks:
- Actor/channel/inbox authorization before target lookup; immutable exact preview and current-policy recheck
- Atomic rename/revocation/history actions, actual ACK/reference pins, restart receipts and duplicate confirmation
- Retained exact request replay precedes new-target admission; no fresh UUID or sender/epoch rewrite
- Nonblocking/no-follow bounded local reads, malformed scope rejection and short checkpoint CAS outside API work
- Read-only private global operator diagnostics versus channel-scoped identity controls; no provider probe
- Public-cursor-only header, retained locator/wire/echo behavior, complete runtime and three-gate test registrations
residuals:
- Trusted non-hostile workspace only; same-user credential/filesystem compromise and independent message-authority
  inference remain outside guarantee
- History cleanup is bounded and may remain pinned by unknown-reference populations; no external erasure or automatic
  committed-operation receipt pruning
- Actual production idle CPU/RSS comparison is not established by pipeline-process peak RSS; runtime custodian observation
  remains separate
- Live owner admission, AHP/native queue, hourly host scheduling and stronger independent audit guarantees remain
  unqualified/external-owned
