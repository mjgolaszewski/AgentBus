      src/agentbus_rename_client.py: 6723f44f650102afead1a507d1a62abe603e799e4568d4a1b35e08cff0b232c0
  primitive: service-classified message actionable projection
  states_and_transitions: renamed alias_direct queued presented retired acknowledged
  typed_exclusions: Presentation is not semantic ACK; broadcasts/context/unrouted remain routine
  operation_contract: contracts/participation/v2/participation.contract.yml
  producer: test
  consumer: poll worker; peek_event
  negative_controls: real rename old-route inbox; quiet worker and peek; quiet-off; foreign spool; stable cursor/session/inbox
  evidence:
  - tests/test_poll_client.py::test_quiet_keeps_service_authorized_alias_at_direct_priority
  - tests/test_rename_store.py::test_real_rename_alias_inbox_survives_quiet_worker_and_peek
  edge_dispositions:
    rename_old_alias: Service inbox classifies old reserved route actionable for same stable session; quiet worker
      and peek retain direct blocker priority.
    routine_or_context: Broadcast/unrouted/context-only remain routine; no alias authority inferred from client
      text.
    foreign_projection: Existing service/inbox/channel/chat/session projection guard precedes merge or cursor advance.
    quiet_off: Retained alias presentation remains available; cleanup never claims semantic ACK.
    cadence_projection: Client mirrors finite canonical cadence with valid custom-cap parity and exact invalid policy
      rejection; no service import.
  implementation_symbols:
  - src/agentbus_poll_client.py::_routine_message
  - src/agentbus_poll_client.py::peek_event
  - src/agentbus_poll_client.py::_worker
