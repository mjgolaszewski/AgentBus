work_orders:
- id: RC5-01
  status: verified_on_946445c_candidate
  invariant: Independent eligible delivery progresses and expiry settles without ancestry reservation
  domain_law: Delivery eligibility combines durable obligation state, channel-bound ancestry, recovery coverage
    and recipient outcomes; only reservation allocates provider attempts, and expiry never asserts delivery or ACK.
  pinned_canonical_owner:
    families:
    - agentbus_service_state
    - agentbus_message_lifecycle
    symbols:
    - src/agentbus_local_delivery_service.py
    - src/agentbus_delivery_runtime_service.py
    - src/agentbus_message_lifecycle_service.py
    - src/agentbus_retention_service.py
    baseline_sha256:
      src/agentbus_local_delivery_service.py: 658e2405068ee0e8d995fed08875fbd3cb348fc039b9c43c4f521af1d64188e8
      src/agentbus_delivery_runtime_service.py: cf42ea4a2ffa04233ae1168a3726f3100f050d3a09e61c7ca2ff95471a9be983
      src/agentbus_message_lifecycle_service.py: d3dce8ddb3b036b90bbe929db25a316845a11f4e16163c2c4c376d2b3d5f6027
      src/agentbus_retention_service.py: 491f7efc26e1a8e29da1c1f18701fac7e03a9f40c4a1c375c5e18edbbdea69de
  primitive: local_delivery_obligations
  states_and_transitions: pending parent_not_ready independent_ready submitting uncertain blocked submitted expired_unsubmitted
    expired_uncertain
  typed_exclusions: Unknown provider outcome stays unresolved; parent failure never fabricates success
  operation_contract: contracts/messages/v1/message-lifecycle.contract.yml
  producer: contract-test
  consumer: LocalDeliveryWorker; retention
  negative_controls: 100 blocked replies then independent; expiry without reserve; restart; retained uncertain;
    channel isolation
  evidence:
  - tests/test_message_lifecycle.py::test_blocked_ancestry_cannot_starve_independent_delivery_or_expiry
  - tests/test_message_lifecycle.py::test_parent_recovery_unblocks_child_after_restart_without_cross_channel_expiry
  - tests/test_message_lifecycle.py::test_expiry_settlement_rolls_back_targets_and_obligations_together
  - tests/test_message_lifecycle.py::test_newly_ready_reply_chain_progresses_only_within_remaining_cycle_budget
  - tests/test_message_lifecycle.py::test_eligibility_refresh_cannot_project_foreign_payload_through_shared_request_key
  edge_dispositions:
    atomic_expiry: Target and obligation updates join one existing writer transaction; injected failure or outer-command
      rollback retains both original states, then exact retry settles.
    parent_not_ready_or_failed: Without a proved provider or thread reference hold the child without reserve; test
      readiness before bounded selection. A known thread root retains existing child eligibility without claiming
      parent submission success. Unknown/no-lifecycle deadlines remain pinned.
    independent_ready: Eligible row beyond blocked prefix receives submission within the same bounded cycle.
    unsubmitted_expired: Explicit channel command settles expired_unsubmitted before selection without incrementing
      attempts.
    attempted_expired: expired_uncertain remains outstanding, recoverable and retention-pinned.
    restart_parent_recovery: Durable parent observation unblocks child thread after reopen; foreign channel remains
      pending.
    provider_uncertain: Existing coverage-bound recovery/retry rules unchanged; missing history cannot authorize
      resend.
    newly_ready_parent: Refresh eligibility after actual progress within the remaining shared attempt budget/deadline;
      same-cycle parent/child behavior preserved, budget3 then1 chain proves no reset or extra submissions.
    refresh_channel_scope: Both initial and refreshed eligibility reads retain explicit channel context. A foreign
      payload colliding with a still-blocked local request UUID cannot enter the local poster; removing only refreshed
      scope fails the oracle.
  implementation_symbols:
  - src/agentbus_local_delivery_service.py::LocalDeliveryStore.pending
  - src/agentbus_local_delivery_service.py::LocalDeliveryStore.settle_expired
  - src/agentbus_delivery_runtime_service.py::LocalDeliveryWorker.submit_once
- id: RC5-02
  status: verified_on_946445c_candidate
  invariant: Fresh mandatory controls precede ordinary wake admission
  domain_law: Service session/control authority outranks disposable client projection; host execution facts and
    target acknowledgements remain independent authorities.
  pinned_canonical_owner:
    families:
    - agentbus_host_adapter
    - agentbus_channel_authority
    symbols:
    - src/agentbus_codex_wake_client.py
    - src/agentbus_codex_wake_events_client.py
    - src/agentbus_codex_wake_intent_client.py
    baseline_sha256:
      src/agentbus_codex_wake_client.py: 96d9ade45dc122715a530e8899b198c7a572f295a842ce581dff1efb23ea7937
      src/agentbus_codex_wake_events_client.py: 558deb8007103f8cfa51b07b23730f5ca14099cf8a41d6e9f16e62c40d5527f1
      src/agentbus_codex_wake_intent_client.py: b1d9f91bc651f8e125baab416310b97cd1384c61c17d68b0039595571aebf03c
  primitive: exact-session self-presence outstanding_controls
  states_and_transitions: ordinary_pending control_pending deferred stopped uncertain notification_only
  typed_exclusions: No active turn cancellation, control ACK, AHP conformance or atomic owner admission claim
  operation_contract: contracts/codex-wake/v1/codex-wake.contract.yml
  producer: test
  consumer: run_once; host adapter
  negative_controls: STOP between spool and admission; checkpoint/policy; missing projection; uncertain attempt;
    unknown owner; revoked session
  evidence:
  - tests/test_codex_wake_client.py::test_fresh_control_presence_blocks_ordinary_spool_admission
  - tests/test_codex_wake_client.py::test_fresh_authority_requires_matching_control_or_policy_projection
  - tests/test_codex_wake_client.py::test_real_stop_between_spool_and_admission_never_picks_up_or_starts_host
  - tests/test_codex_wake_client.py::test_fresh_control_deferral_preserves_uncertain_host_intent
  - tests/test_codex_wake_client.py::test_status_reports_fresh_control_projection_lag_without_writes
  edge_dispositions:
    projection_lag: Fresh outstanding mandatory control or unacknowledged policy defers ordinary refs before pickup/reconciliation/host
      submission.
    fresh_projected_control: Matching authoritative controls retain priority and do not acknowledge or cancel an
      active turn.
    stale_or_malformed_control: Missing/malformed references cannot satisfy current required controls; contradictory
      empty pending projection defers.
    stopped_or_revoked: Existing exact-session denial remains ahead of admission; no ordinary host effect.
    uncertain_or_active_owner: Control projection deferral preserves existing IN_FLIGHT host observations and last_attempt
      exactly; no cancellation, reconciliation retry or ordinary launch. Owner-side idle proof remains required.
    owner_interop: 'Typed exclusion: Issue75 live AHP/native queue and atomic admission remain unqualified.'
    self_status: Fresh control priority is identical in read-only readiness and live admission; filesystem snapshot
      and host-call negative controls prove no query side effect.
  implementation_symbols:
  - src/agentbus_codex_wake_client.py::run_once
  - src/agentbus_codex_wake_client.py::status
  - src/agentbus_codex_wake_events_client.py::controls_projected
  - src/agentbus_codex_wake_intent_client.py::record_result
