document:
  kind: bug_disposition_audit
  path: audits/rc10-bug-inventory.yml
  status: candidate_validation_pending
scope:
  owner: AgentBus current released behavior and source candidate
  evidence: reported incidents plus source traces and behavioral reproductions
  excluded: new hostile-workspace guarantees or unqualified owner-host integrations
bugs:
- id: expired_announcement_projection
  disposition: fixed_focused_accepted_canonical_pending
  cause: cached ordinary control outlives service read deadline and demands rejected late ACK
  correction: fresh authenticated service snapshot retires prior cached broadcast_poll_presentation_only
  proof: existing poll and message-lifecycle populations; 88 focused cases passed
- id: poll_observation_missing
  disposition: focused_green160_accepted_final_subject_pending
  cause: foreground poll displays and consumes message without advancing observation high_water
  correction: complete foreground observation under fresh exact-scope credential-bound profile lock
  proof: new launcher red case fails before repair; no extra inbox read should be required
- id: stale_cursor_save
  disposition: focused_green160_accepted_final_subject_pending
  cause: serialized stale whole-profile save can overwrite newer ACK and observed cursors
  correction: merge cursor maxima for matching session scope; explicit rebind keeps intentional reset
  proof: new launcher red case fails before repair; existing rebind preservation case passes
- id: stale_profile_authority
  disposition: source_fix_authored_characterization_and_green_pending
  cause: stale whole-profile writer can replace newer session secret STOP or staged recovery intent
  correction: private read-snapshot compare_and_swap under existing lock; independent metadata merge and conflicting intent rejection
  proof: original frozen six-case RED subject retained; snapshot and concurrent-intent controls added to stacked candidate
- id: committed_rotation_lost_response
  disposition: source_fix_authored_characterization_and_green_pending
  cause: old revoked secret info preflight prevents recovery of already committed rotation receipt
  correction: exact retained grant and staged secret recover canonical receipt directly; new rotation still requires valid current session
  proof: isolated actual ParticipationStore revokes old secret before client retry; retained request and receipt equality plus STOP preservation
- id: bound_service_check_after_credential_egress
  disposition: source_fix_authored_characterization_and_green_pending
  cause: checked_profile and rebind compare service binding after sending session proof; file enrollment lacks early bound-service check
  correction: reject service mismatch before credential-bearing info enrollment or rotation requests
  proof: request-observation controls require zero API calls and unchanged private staging on mismatch
- id: stale_release_mutation_target
  disposition: corrected_awaiting_governed_preparation
  cause: version-drift negative control still searched prior package version after candidate bump
  correction: target current package literal while retaining wrong-version mutant and rejection oracle
  proof: actual owner preparation failed governance before correction; first output retained
- id: current_guide_chronology
  disposition: updated_current_guides_exact_source_checks_pending
  correction: present behavior and limits in product guides; retain historical subjects in release and engineering evidence
  proof: per-document digests dispositions and changed-span review in editorial inventory
not_bugs:
- report: historical_query_ACK_guard
  disposition: expected_stateless_query_semantics_supported_recovery_verified
  evidence: ordinary inbox advanced observation and explicit handled ACK succeeded without reset
- report: old_ordinary_poll_message
  disposition: expected_unacknowledged_backlog_with_quiet_off
