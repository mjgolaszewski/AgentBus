invariants:
- Exact session/channel/inbox before lookup
- Retain original request UUID and staged payload
- Presentation pickup completion and ACK remain distinct
- No new broker daemon periodic provider probe or production wake
items:
- workitem: P17-P1-01
  domain: operator_federation
  layer: private query presentation
  contract: contracts/federation/v1/operator.contract.yml
  primitive: existing operator_fanout retained request
  producer: recent_operator_buttons
  consumer: configured Slack results federated
  evidence:
  - tests/test_slack_commands.py
  - tests/test_operator_federation.py
  acceptance: Poll listing excludes federation; typed bounded history stays actor/channel scoped and read only
- workitem: P17-P2-01
  domain: message_lifecycle
  layer: client presentation and HTTP transport
  contract: contracts/messages/v1/message-lifecycle.contract.yml
  primitive: original delivery key, existing request_outcome, local presentation high-water
  producer: deliver_payload and send_message
  consumer: CLI/MCP status and ACK diagnostics
  evidence:
  - tests/test_delivery_client.py
  - tests/test_local_delivery_custody.py
  - tests/test_launcher.py
  acceptance: Original UUID status locator, authenticated relative Location, numeric ACK limits; unknown never proves
    nonacceptance
- workitem: P17-P3-01
  domain: participation_recovery
  layer: client query projection
  contract: contracts/participation/v2/recovery-observation.contract.yml
  primitive: existing scoped inbox and resume checkpoint
  producer: cli_resume
  consumer: opt-in --unhandled CLI reader
  evidence:
  - tests/test_recovery_client.py
  acceptance: At most100 scanned/20 returned, truthful partial window, no ACK/presentation advance and controls
    first
- workitem: P17-P4-01
  domain: owner_notification
  layer: existing worker
  contract: contracts/codex-wake/v1/codex-wake.contract.yml
  primitive: independent control and inbox deadlines
  producer: _worker/project_check_in
  consumer: existing local spool/poll
  evidence:
  - tests/test_poll_client.py
  - tests/test_poll_projection_recovery.py
  disposition: Existing controls project at their own bound; ordinary addressed messages wait for the negotiated
    inbox deadline. Participation/worker owners retain mailbox-change notification research; host admission remains
    independently unqualified under Issue75. No daemon, forced model turn or extra polling added.
