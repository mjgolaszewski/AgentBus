  - contract-test
- id: P14-P3-01
  priority: P3
  status: IN_PROGRESS
  summary: Interruption-aware resume and optional private stale notices
  acceptance:
  - Service enrollment last observed access and consumer-reported work remain separate; missing gaps stay unknown
  - Off-by-default operator notices reuse worker ticks deduplicate until recovery and grant no wake retry or execution
    authority
  acceptance_evidence:
  - test
  - contract-test
- id: P14-P3-02
  priority: P3
  status: IN_PROGRESS
  summary: Activity-aware quiet polling and acknowledgement-safe automatic retention
  acceptance:
  - Automatic purge preserves the thirty-day default and a fourteen-day floor after meaningful per-message lifecycle
    transitions; retain original request and retirement identities
  - Inactive or stopped agents do not imply acknowledgement; unsettled or unacknowledged required recipients and
    reference or replay dependencies remain pinned
  - Quiet polling reuses delivered backoff with separately bounded safety controls; routine polling does not extend
    all historical payload lifetimes
  - Existing worker performs bounded opt-in dry-run-first retention batches with receipt audit and no new daemon;
    abandoned work needs explicit operator disposition
  - Old cursor and UUID lookups distinguish retired history from never accepted; FTS retirement stays transactional
    and scope-bound
  acceptance_evidence:
  - test
  - contract-test
