phase:
  id: P11
  build_block: qualified_federation_runtime
  planner: codex
  date: '2026-10-15'
  scope_source:
  - AGENTS.yml
  - plans/product-spec.yml
  - plans/build-plan.yml
  - plans/phase-ledger.yml
  - MEMORY.yml
delivery_contract:
  tightly_scoped_deliverables:
  - qualify provider fan-out and origin authentication
  - implement durable federation bridge and remote directory primitives
  - close federation replay deduplication resync and authority exclusions
  - prove deterministic and provider evidence
  - publish only after final BCF custody
  parallelizable_workstreams:
  - id: P11-WS1
    name: provider_qualification
  - id: P11-WS2
    name: bridge_and_directory
  - id: P11-WS3
    name: federation_state_machines
  - id: P11-WS4
    name: evidence_and_custody
  hard_dependencies:
  - P10 closed on exact main through authenticated BCF 2.3.4 truth
  - real-provider and cross-instance claims require qualified fan-out and origin authentication on a dedicated candidate; independent deterministic construction may proceed with that qualification blocked
  docker_first_local_runtime: repo_native_validation_and_governance_commands
  completeness_standard: full_completeness_for_declared_scope
scope_lock:
- order: 1
  statement: keep the phase narrowly scoped to declared deliverables and update canonical
    governed artifacts in the same change
- order: 2
  statement: do not activate P11 until P10 closes through BCF canonical lifecycle
- order: 3
  statement: provider fan-out and origin authentication require a dedicated qualifying
    candidate before any cross-instance claim
- order: 4
  statement: remote transport and discovery never authorize local execution, sessions,
    privileges, wake, or acknowledgement
- order: 5
  statement: reuse the existing AgentBus service, SQLite store, provider adapter, and
    BCF assurance graph; no second broker, registry, writer, or public endpoint
verification_plan:
- make governance-validate
- make architecture-test
- make lint
- make typecheck
- make test
- make contract-test
- make release-check
