document:
  kind: product_spec
  name: "AgentBus Product Spec"
  id: "agentbus-product-spec"
  version: 1.0.0
  generated_at_utc: "2026-09-27T00:00:00Z"
  status: active_delivery
  path: plans/product-spec.yml
product:
  name: "AgentBus"
  project_name: "AgentBus"
  positioning: "Slack-backed coordination transport and durable inbox for coding-agent chats"
  target_users: ["coding agents and operators coordinating through Slack"]
  non_goals:
    - "AgentBus core executing or orchestrating coding agents; an optional host-owned adapter may start an explicitly bound Codex thread"
    - "using persona labels as authentication or authorization"
    - "providing offline Slack history, exactly-once Slack delivery, or a general message broker"
constraints:
  operating_constraints:
    - "one Socket Mode receiver per Slack application"
    - "bearer-authenticated HTTP is loopback-only unless an operator supplies a secure boundary"
    - "SQLite and consumer profiles remain outside source and release archives; Python 3.12 or newer uses dependencies locked by uv"
    - "routed Slack envelopes require the bot identity authenticated from the configured token"
    - "operators approve both Slack retention and the local SQLite copy for transported data"
    - "operator controls require authority separate from ordinary agent send authority"
  known_external_dependencies: ["Slack Web API and Socket Mode", "SQLite", "GitHub Actions hosted runners", "Docker for container release evidence"]
architecture:
  backend: "flat client and service contexts with closed CLI and HTTP operation populations; optional host-owned Codex wake adapter"
  frontend: "not applicable; the product is a CLI and HTTP service"
  data: "SQLite durable inbox plus local JSON consumer profiles"
execution_phases:
  - {phase_id: P01, build_block: "existing_repo_adoption", objective: "forward-port preserved AgentBus assurance into BCF 2.1 Standard governance", release_train: release_1}
  - {phase_id: P02, build_block: "assurance_topology_patch", objective: "release 0.3.1 with one truthful BCF assurance path and restored Python 3.14 proof", release_train: release_2}
  - {phase_id: P03, build_block: "transport_and_portability_hardening", objective: "authenticate Slack ingress and harden portability, retention guidance, test ergonomics, and bounded inbox reads", release_train: release_3}
  - {phase_id: P04, build_block: "operator_participation_plane", objective: "derive and deliver Issue #6 participation plus optional Issue #8 Codex wake adapter from their versioned contracts", release_train: release_4}
  - {phase_id: P05, build_block: "security_provenance_foundation", objective: "release 0.6.0 with service-derived message provenance, legacy wake exclusion, bounded ingress, and visible presentation", release_train: release_5}
  - {phase_id: P06, build_block: "security_identity_enforcement", objective: "release 0.7.0 with enrolled-route proof, exact-session controls, and bounded sends", release_train: release_6}
  - {phase_id: P07, build_block: "producer_supply_chain_hardening", objective: "release 0.7.1 with digest-pinned Docker uv, released BCF workflow-input/direct-main fixes, and bounded Codex thread resume", release_train: release_7}
  - {phase_id: P08, build_block: "governance_dependency_completion", objective: "release 0.7.2 after BCF-owned dependency hash locking and proxy-header remediation", release_train: release_8}
