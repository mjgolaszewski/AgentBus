  - {phase_id: P07, build_block: producer_supply_chain_hardening, objective: "publish AgentBus 0.7.1 after released BCF producer fixes", hard_dependencies: ["P06 closed on exact main and v0.7.0 published", "BCF workflow-input, governance dependency-lock, and proxy-header fixes released with immutable custody"], tightly_scoped_deliverables: ["pin Docker uv bootstrap to immutable multiarch digest", "adopt BCF fixes through canonical upgrade machinery", "prove exact candidate and isolated release archive"], parallelizable_workstreams: [docker_bootstrap, bcf_upgrade, release_evidence], verification_commands: [make governance-validate, make architecture-test, make lint, make typecheck, make test, make contract-test, make release-check]}
