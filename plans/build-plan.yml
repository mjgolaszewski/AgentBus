    hard_dependencies: ["P03 closed on exact main", "contracts/participation/v1/participation.contract.yml passes contract validation"]
    tightly_scoped_deliverables: ["establish stable chat/session identity, versioned policy and separate operator authority", "deliver silent active polling, truthful presence and durable acknowledged controls", "preserve routing, claims, cursors and attribution across safe rename and restart", "provide an optional host-owned Codex wake adapter with dry-run, explicit binding, and fail-closed launch", "prove contract adversarial obligations, compatibility and exact-tree BCF evidence"]
    parallelizable_workstreams: [contract_and_migration, participation_and_policy, controls_and_presentation, optional_codex_host_adapter]
    verification_commands: [make governance-validate, make architecture-test, make lint, make typecheck, make test, make contract-test, make release-check]
  - {phase_id: P05, build_block: security_provenance_foundation, objective: "publish AgentBus 0.6.0 provenance foundation", hard_dependencies: ["P04 closed on exact main"], tightly_scoped_deliverables: ["derive sender assurance at the service", "keep legacy messages readable but ineligible for Codex wake", "bound ingress and credentials, validate threads and routes, expose authenticated status", "prove exact candidate through canonical BCF graph"], parallelizable_workstreams: [provenance_and_ingress, compatibility_and_docs], verification_commands: [make governance-validate, make architecture-test, make lint, make typecheck, make test, make contract-test, make release-check]}
