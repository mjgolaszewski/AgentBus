  primary_source_of_truth: plans/product-spec.yml
  governance_references:
    - AGENTS.yml
    - MEMORY.yml
    - plans/phase-ledger.yml
global_delivery_rules:
  - change units default to the smallest valid vertical slice with low blast radius
  - every behavior change must update specs, plans, MEMORY, and tests together
  - preserve public contracts unless an explicit instruction and migration note authorize a breaking change
  - release gates must run in a declared runtime environment
  - governed artifacts must pass structural schema validation before semantic cross-artifact validation
  - architecture boundaries must be encoded in tests, not left as convention-only prose
  - backend delivery defaults to CQRS-lite with strict ports unless repo governance changes it explicitly
  - "backend delivery follows contract-first sequencing: contracts, ports, tests, use case, router, and infrastructure only as required"
  - governance changes must pass semantic validation, not only YAML parse checks
  - observability changes must preserve the shared telemetry and logging contract baseline
  - active phase lifecycle uses the governed taxonomy and records control metadata when work is blocked, paused, or abandoned
  - governed build artifacts must follow the template-pack naming and validation conventions
  - completed release trains must preserve governed phase history for each declared phase
  - new abstractions require proven reuse across at least two real call sites unless explicitly authorized
  - emergency red-CI and release-blocking fixes must use the governed hotfix lane
  - lite hotfix mode is reserved for a single-commit repair with no public-contract or security-scope change; all other hotfixes use full mode
global_gates:
  - id: G1
    name: governed_foundation
    applies_before: release_1
    required_completion_criteria:
      - existing application assurance and provider boundaries are inventoried
      - BCF 2.1 Standard profile contract v3 owns the canonical assurance graph
      - deterministic preflight rejects graph and configuration defects before evidence fan-out
      - selective behavioral producers preserve every unique application proposition
      - the exact reconciled candidate passes the canonical prospective train
phase_sequence:
  - phase_id: P01
    build_block: "existing_repo_adoption"
    objective: "forward-port AgentBus into released BCF 2.1 Standard governance and publish v0.3.0"
    hard_dependencies: []
    tightly_scoped_deliverables:
      - "characterize inherited behavior, tests, CI, security controls, release paths, and boundaries"
      - "install immutable BCF 2.1 and replace bootstrap values with AgentBus contracts"
      - "model CLI, HTTP, routing, persistence, Slack, security, packaging, and runtime claims"
      - "prove selective invalidation, evidence reuse, early rejection, and fail-closed ambiguity"
      - "reconcile and prospectively prove exact v0.3.0 candidate bytes"
      - "publish the release and migrate the superworkspace consumer to an immutable pin"
    parallelizable_workstreams: [existing_repo_inventory, application_contract_and_gate_implementation, documentation_and_release_packaging, consumer_expand_contract_cutover]
    verification_commands: [make governance-validate, make check, make test, make release-check]
  - phase_id: P02
    build_block: "assurance_topology_patch"
    objective: "release AgentBus 0.3.1 with one truthful BCF assurance graph"
    hard_dependencies: ["P01 closed on exact main"]
    tightly_scoped_deliverables:
      - "restore Python 3.14 behavior proof inside a governed primary-lane producer subprocess"
      - "remove duplicate architecture execution and give source integrity a truthful claim owner"
      - "route retained project commands through canonical BCF gates and produce the 0.3.1 candidate"
    parallelizable_workstreams: [assurance_topology]
    verification_commands: [make governance-validate, make lint, make python314-compatibility, make release-check]
  - phase_id: P03
    build_block: "transport_and_portability_hardening"
    objective: "authenticate Slack ingress and harden AgentBus portability and bounded reads"
    hard_dependencies: ["P02 closed on exact main"]
    tightly_scoped_deliverables:
      - "authenticate routed Slack envelopes against the configured bot token identity"
      - "bound identity-aware inbox reads in indexed SQLite queries with existing-state migration"
      - "use portable consumer-state defaults and make the default suite valid on supported interpreters"
      - "document Slack retention, trust boundaries, and deliberately deferred product scope"
    parallelizable_workstreams: [transport_security, persistence_scaling, portability_and_documentation]
    verification_commands: [make governance-validate, make architecture-test, make lint, make typecheck, make test, make contract-test, make python314-compatibility]
