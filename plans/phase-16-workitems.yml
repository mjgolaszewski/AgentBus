workitems:
- id: P16-P0-01
  priority: P0
  status: DONE
  summary: Contract Racecar recovery suggestions and security residual owners
  acceptance:
  - Every Racecar suggestion maps to a canonical existing store/owner or explicit external-owner disposition
  - No new broker registry scheduler credential copying or execution authority; external resource/NFS/controller
    guarantees not claimed
  acceptance_evidence:
  - test
  - contract-test
- id: P16-P1-01
  priority: P1
  status: DONE
  summary: Extend local resume continuity and source/update-deadline observations
  acceptance:
  - Credential-free record binds exact source commit/branch/tree, dirty source locations, report deadline, held
    owners and receipt cursors
  - Unknown/mismatched state retained; no resurrection of old credentials grants or checkpoints
  - Local agents listing includes actual scoped identity profiles only, never checkpoints or redirect projections;
    preserve valid legacy profiles and all custody during owner-directed migration or retirement.
  acceptance_evidence:
  - test
  - contract-test
- id: P16-P2-01
  priority: P2
  status: DONE
  summary: Expose scoped custodian handoff freshness as non-authorizing context
  acceptance:
  - Use existing accepted messages and operator configuration for optional current-channel contact/receipt hints;
    no new persistent registry
  - Report authorship observation time expiry service/host epoch and unknown states explicitly; never infer job
    admission
  - Queries expose no foreign channel roster counts credentials or session proof
  acceptance_evidence:
  - test
  - contract-test
- id: P16-P3-01
  priority: P3
  status: DONE
  summary: Render local cursor first without modifying signed wire custody
  acceptance:
  - Channel-local public cursor appears first with location label wherever known before posting
  - Shared federated headers never invent destination-local positions; omit unprovable values
  - Signed wire, content echo, idempotency, reply ancestry and recovery remain compatible
  acceptance_evidence:
  - test
  - contract-test
- id: P16-P3-02
  priority: P3
  status: DONE
  summary: Private configured-command diagnostics with recent receipt incident buttons
  acceptance:
  - Primary configured command and explicitly registered aliases route diagnostics through the same human allowlist/channel
    checks
  - Read-only grouped worker/queue/receipt reason views omit tokens message bodies and raw provider responses; buttons
    retain exact destination authorization
  - Existing private health and diagnostics show each federation custody table count and finite configured limit,
    with the existing 80-percent warning convention before admission closes; no new worker or provider probe
  - Fully hung service is disclosed as requiring custodian out-of-band capture; no repair/retry/reset actions implied
  acceptance_evidence:
  - test
  - contract-test
- id: P16-P3-03
  priority: P3
  status: DONE
  summary: Private configured-command identity management with explicit previews and confirmations
  acceptance:
  - Configured command identities provides channel-scoped private selection/buttons and exact unambiguous targets;
    no UUID typing requirement or remote filesystem authority.
  - Rename preserves immutable chat/channel/inbox, authorized namespace, aliases and pending request identities;
    no cross-channel or remote-origin mutation.
  - Remove/retire and operator revocation preserve history and tombstones; operator revocation is distinct from
    semantic STOP acknowledgement and never fabricates recipient completion or ACK.
  - Remove with history previews eligible and pinned populations; explicit confirmation respects retention floor,
    original target acknowledgements, shared ancestry and all unresolved message/federation/publication custody.
  - History cleanup covers eligible local AgentBus content only; it does not delete Slack posts, remote copies or
    client updates or promise physical secure erasure. Duplicate buttons, changed policy/scope/target, restart,
    concurrent rename/revocation and partial cleanup fail safely; final receipts accurately report retired, removed,
    pinned and uncertain outcomes.
  - No live removal or history purge is authorized by adding this construction feature; default roster hides retired
    entries with an explicit retained-history view.
  acceptance_evidence:
  - test
  - contract-test
- id: P16-P4-01
  priority: P4
  status: DONE
  summary: Advance current offline owner and provenance qualification
  acceptance:
  - Exact installed owner/static capability inventory covers documented native mailbox/queue/AHP paths with zero
    model calls
  - Deterministic negative controls cover actor provenance owner/backend/incarnation active/unknown/interrupted
    states and ambiguous outcomes
  - Unsupported owner-side atomic admission remains typed blocked/notification-only; no live model canary or private
    transport takeover inferred
  acceptance_evidence:
  - test
  - contract-test
- id: P16-P5-01
  priority: P5
  status: DONE
  summary: Deliver bounded recovery runbooks and release proof
  acceptance:
  - Reviewed launcher/NFS/cache/portable evidence guidance refers to canonical custodian/resource owners instead
    of implementing new host systems
  - Finite federation capacity guidance preserves every retained history row, original retry UUID and checkpoint;
    configured capacity review is separate from unqualified federation archival
  - Approved credential-free review exports use fresh inodes rather than hard links, with original manifest and
    byte mapping; live/private permissions remain unchanged and changed packaging never inherits an old digest
  - Canonical final-subject proof install/skill/compatibility checks and measured default-off overhead complete
  - External prerequisites stay blocked with resume conditions; no unsupported production wake or stronger hostile-agent
    guarantee
  - Complete fresh line-by-line editorial review of every tracked editorial file, not changed files only, with exact
    hash/line count and reviewed/added/edited/combined/removed disposition; include skill, examples and every visual/table/diagram,
    excluding BCF machinery and changelog, preserving graphics/tone and README BCF placement.
  acceptance_evidence:
  - test
  - contract-test
