document:
  kind: active_execution_phase_ledger
  name: "AgentBus Active Phase Ledger"
  id: "agentbus-phase-ledger"
  version: 1.0.0
  generated_at_utc: "2026-09-27T00:00:00Z"
  status: active_phase_completed
  path: plans/phase-ledger.yml
build_plan_mandate:
  format: yaml
  required_fields:
    - tightly_scoped_deliverables
    - parallelizable_workstreams
    - hard_dependencies
    - docker_first_local_runtime
    - completeness_standard
  completeness_standard: full_completeness_for_declared_scope
active_phase:
  id: P03
  build_block: "transport_and_portability_hardening"
  plan: plans/phase-03-plan.yml
  workitems: plans/phase-03-workitems.yml
  log: phases/phase-03-log.yml
  memory: MEMORY.yml
  spec: plans/product-spec.yml
  build_plan: plans/build-plan.yml
  lifecycle_status: completed
  owner: "agentbus:signal-gardener"
  validation_commands:
    - make governance-validate
    - make architecture-test
    - make lint
    - make typecheck
    - make test
    - make release-check
hotfix_lane:
  scaffold_script: scripts/scaffold_governance_artifacts.py
  default_mode: full
  modes:
    lite:
      allowed_when:
        - single_commit_fix
        - no_public_contract_change
        - no_security_scope_change
    full:
      required_when:
        - default_branch_red_ci
        - release_blocking_regression
        - security_or_expiring_external_breakage
  open_records: []
  remediation_history: []
operator_requirements_choices_disambiguations:
  - type: decision
    statement: all governance, memory, specs, plans, workitem ledgers, and phase logs remain YAML-native
  - type: decision
    statement: BCF Standard profile contract v3 is the final model; Lite is a non-certifying bootstrap only
  - type: constraint
    statement: adopter governance must not install a persistent trusted controller or inherit BCF self-authority
active_delivery_priorities:
  current_tranche:
    - "existing_repo_adoption"
release_trains:
  release_1:
    target_version: "0.3.0"
    status: completed
    focus:
      - governed_foundation
      - selective_assurance_graph
      - standalone_release_and_consumer_cutover
  release_2:
    target_version: "0.3.1"
    status: completed
    focus:
      - single_assurance_graph
      - python_314_compatibility
      - canonical_command_surface
  release_3:
    target_version: "0.3.2"
    status: active
    focus:
      - authenticated_slack_ingress
      - bounded_inbox_reads
      - portable_consumer_state
      - explicit_data_handling
release_readiness:
  computed_by: bcf truth
  requirements_source: governance/evidence-policy.yml
  validating_command: make release-check
definition_of_ready_before_execution:
  - active phase has a plan, workitem ledger, and log
  - validation commands are listed before implementation starts
