hotfix_lane:
  scaffold_script: scripts/scaffold_governance_artifacts.py
  default_mode: full
  modes:
    lite:
      allowed_when:
        - single_commit_fix
        - no_public_contract_change
        - no_security_scope_change
    full:
      required_when:
        - default_branch_red_ci
        - release_blocking_regression
        - security_or_expiring_external_breakage
  open_records:
    - id: P04-HF01
      mode: full
      status: active
      triggered_by_commits: [0fbdc8d5eac76325ed8796ef55737686f9fe6a3c]
      failing_workflows: [https://github.com/mjgolaszewski/AgentBus/actions/runs/36853197127]
      root_cause: P04-P0-01 was closed without a declared successor despite unfinished P04-P0-02 and P04-P0-03.
      remediated_in_phase: P04
      hotfix_log: phases/phase-04-hotfix01.yml
      canonical_artifacts: [plans/phase-04-workitems.yml, plans/phase-ledger.yml, phases/phase-04-hotfix01.yml]
  remediation_history: []
