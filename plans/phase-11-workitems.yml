document:
  kind: execution_phase_workitem_ledger
  name: Phase 11 Workitems
  id: agentbus-phase-11-workitems
  version: 1.0.0
  generated_at_utc: '2026-10-15T00:00:00Z'
  status: active
  path: plans/phase-11-workitems.yml
  phase_id: P11
workitems:
- id: P11-P0-01
  priority: P0
  status: DONE
  summary: baseline P09 custody, map Issue 48 ownership, and qualify provider fan-out and origin authentication
  acceptance:
  - authenticated BCF baseline, exact P09 closure, provider topology, trust, scopes, history, recovery, and budgets are recorded
  - unsupported provider assumptions are explicitly classified as qualified, deferred, or blocked
  - cross-installation claims remain gated until a dedicated provider candidate proves fan-out and origin authentication
  acceptance_evidence: [contract-test]
- id: P11-P1-01
  priority: P0
  status: DONE
  summary: define canonical federation, discovery, custody, receipt, revision, and authority-exclusion contracts
  acceptance:
  - origin identity, publisher binding, bridge states, directory revisions, allowlisted metadata, and prohibited edges are normative
  - protocol 2 messages, cursors, Slack threads, sessions, claims, aliases, and controls remain compatible
  acceptance_evidence: [contract-test]
- id: P11-P2-01
  priority: P0
  status: DONE
  summary: implement durable federation bridge and remote directory primitives with bounded local custody, origin binding, and provider uncertainty
  acceptance:
  - local obligations persist in the existing SQLite owner before provider side effects
  - duplicate and conflicting payloads fail closed, and provider uncertainty remains explicit and recoverable
  acceptance_evidence: [test, contract-test, architecture-test]
- id: P11-P3-01
  priority: P0
  status: DONE
  summary: implement service-owned remote directory snapshots, deltas, revisions, gaps, withdrawal, and resynchronization
  acceptance:
  - only approved active registrations are projected; rename and withdrawal preserve stable identity
  - stale, conflicting, partial, oversized, and out-of-order updates fail closed without purging valid entries
  acceptance_evidence: [test, contract-test]
- id: P11-P4-01
  priority: P0
  status: DONE
  summary: close federation replay deduplication resync and authority exclusions while integrating the existing Slack human adapter
  acceptance:
  - bridge, directory, registration, provider, and owner observations remain distinct and idempotent
  - Slack replies, threading, controls, and status remain functional without foreign text becoming authority
  acceptance_evidence: [test, contract-test, architecture-test]
- id: P11-P4-02
  priority: P0
  status: DONE
  summary: implement the bounded signed-origin provider bridge adapter for isolated P11 qualification
  acceptance:
  - local message and obligation commit before outbound provider effects; retries remain bounded and durable
  - Ed25519 and operator publisher bindings precede destination deduplication and signed custody receipts
  - the existing listener and SQLite owner support bounded recovery without remote execution or session authority
  - deterministic fake-provider evidence covers outage crash replay conflicts forgery and receipt races
  acceptance_evidence: [test, contract-test, architecture-test]
- id: P11-P5-01
  priority: P1
  status: DONE
  summary: prove deterministic and provider evidence, compatibility, adversarial controls, and lightweight resource budgets
  acceptance:
  - deterministic fake-provider tests cover replay, crashes, outage, joins, gaps, and authority exclusions
  - existing AgentBus compatibility and assurance suites remain green with measured bounded resource use
  acceptance_evidence: [test, contract-test, architecture-test]
- id: P11-P6-01
  priority: P1
  status: DONE
  summary: qualify one authorized real provider arrangement and isolated multi-installation canary
  acceptance:
  - two isolated installations and a late joiner prove outbound fan-out, authenticated origin, recovery, and directory convergence
  - no public endpoint, bespoke relay, credential replication, or exactly-once business-effect claim is introduced
  acceptance_evidence: [test, contract-test]
- id: P11-P7-01
  priority: P0
  status: DONE
  summary: publish only after final BCF custody, upgrading to the newest authorized release with exact-tree proof and rollback evidence
  acceptance:
  - BCF upgrade, reconcile, prospective train, protected PR/main, archive, isolated install, compatibility, and rollback evidence are green
  - publication preserves notification-only fallback for unsupported or uncertain provider and owner states
  acceptance_evidence: [architecture-test, test, contract-test, release-smoke, runtime-smoke]
